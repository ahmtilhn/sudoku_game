name: Temporary opponent board dim fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-dim-opponent-board-fast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Patch opponent turn board dim
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()
          start = source.index('class _TurnAwareBoardFrame extends StatelessWidget {')
          end = source.index('class _ArenaMatchLayout extends StatelessWidget {', start)
          section = source[start:end]
          old = 'color: Colors.black.withValues(alpha: .30),'
          new = 'color: Colors.black.withValues(alpha: .38),'
          if old not in section:
              print('Dim already applied; nothing to change.')
          else:
              section = section.replace(old, new, 1)
              path.write_text(source[:start] + section + source[end:])

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/duel/online_duel_screen.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Dim board during opponent turn'
          git push origin HEAD:main
