name: Temporary opponent-turn board dim

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-dim-opponent-board.yml'

permissions:
  contents: write

concurrency:
  group: tmp-opponent-board-dim-main
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Increase opponent-turn board dim
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()
          start = source.index('class _TurnAwareBoardFrame extends StatelessWidget {')
          end = source.index('class _ArenaMatchLayout extends StatelessWidget {', start)
          section = source[start:end]
          old = 'color: Colors.black.withValues(alpha: .30),'
          new = 'color: Colors.black.withValues(alpha: .38),'
          if old not in section:
              raise SystemExit('Opponent-turn dim anchor not found')
          section = section.replace(old, new, 1)
          path.write_text(source[:start] + section + source[end:])

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Commit UI change directly to main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Dim board during opponent turn'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
