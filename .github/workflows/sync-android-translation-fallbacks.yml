name: Verify Android localization release build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-android-translation-fallbacks.yml'
      - 'android/app/build.gradle.kts'
      - 'android/app/src/main/res/values/**/*.xml'
      - 'android/app/src/main/res/values-*/**/*.xml'
      - 'assets/localization/Localizable.xcstrings'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-android-localization-release-main
  cancel-in-progress: true

jobs:
  release-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Create ephemeral release signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=Sudoku Duel Localization CI, OU=CI, O=Devovia, L=CI, ST=CI, C=NL'
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF

      - name: Verify production release AAB and localization lint
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub \
            --dart-define=APP_ENVIRONMENT=production \
            --dart-define=SOCIAL_BACKEND_URL=https://sudoku-duel-social-production.ilhanahmet246.workers.dev \
            --dart-define=BUILD_COMMIT="${GITHUB_SHA:0:12}"

      - name: Confirm release bundle exists
        shell: bash
        run: test -s build/app/outputs/bundle/release/app-release.aab
