name: Fix high visibility Turkish localizations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-high-visibility-turkish-localizations-main.yml'
      - 'tool/fix_high_visibility_turkish_localizations.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-high-visibility-turkish-localizations-main
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply Turkish catalog and Android resources
        run: python3 tool/fix_high_visibility_turkish_localizations.py

      - name: Validate localization catalog
        run: python3 tool/validate_localizations.py

      - name: Verify requested screens use localization keys
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          checks = {
              'lib/features/duel/matchmaking_stage.dart': [
                  'matchmaking_looking_near_rank',
                  'matchmaking_tip',
                  'matchmaking_keep_open',
                  'opponent_search',
                  'opponent_search_body',
              ],
              'lib/features/social/profile_customization_screen.dart': [
                  'profile_customization',
                  'avatars',
                  'frames',
                  'badges',
                  'country',
              ],
              'lib/features/social/emote_loadout_screen.dart': [
                  'emotes',
                  'quick_emotes',
                  'quick_emotes_reorder_body',
                  'choose_reactions',
              ],
              'lib/features/duel/leaderboards_screen.dart': [
                  'visible_rp_rank_info',
                  'ranked_ladder',
                  'global_rp_leaderboard',
              ],
          }

          failures = []
          for path, keys in checks.items():
              source = Path(path).read_text(encoding='utf-8')
              for key in keys:
                  pattern = rf"context\.tr\(\s*['\"]{re.escape(key)}['\"]"
                  if not re.search(pattern, source):
                      failures.append(f'{path}: missing context.tr for {key}')

          if failures:
              raise SystemExit('\n'.join(failures))
          print('Requested screens are wired to localization keys.')
          PY

          grep -Fq 'Rütbene yakın bir oyuncu aranıyor' android/app/src/main/res/values-tr/strings.xml
          grep -Fq 'Görünen RP, gösterilen rütbeni belirler' android/app/src/main/res/values-tr/strings.xml
          grep -Fq '"Rütbene yakın bir oyuncu aranıyor"' assets/localization/Localizable.xcstrings
          grep -Fq '"Görünen RP, gösterilen rütbeni belirler' assets/localization/Localizable.xcstrings

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Run localization guards
        run: |
          python3 tool/verify_localized_user_copy.py
          python3 tool/verify_exhaustive_user_copy.py
          python3 tool/verify_user_facing_messages.py
          python3 tool/verify_non_widget_user_copy.py

      - name: Analyze requested surfaces
        run: >-
          flutter analyze --fatal-infos
          lib/features/duel/matchmaking_stage.dart
          lib/features/duel/leaderboards_screen.dart
          lib/features/social/profile_customization_screen.dart
          lib/features/social/emote_loadout_screen.dart
          lib/models/online_duel_emote_catalog.dart
          lib/localization/app_strings.dart

      - name: Commit localized platform resources to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Flutter setup/pub-get may rewrite tracked tooling files. They are not
          # part of this localization change and must not block a clean rebase.
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true

          git add assets/localization/Localizable.xcstrings android/app/src/main/res/values-tr/strings.xml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Requested Turkish localizations are already materialized.'
            exit 0
          fi
          git commit -m "Localize online profile emotes and RP copy in Turkish"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
