name: Localize account protection UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-account-protection-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-account-protection-main
  cancel-in-progress: false

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Localize all visible account-protection copy
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/settings/account_protection_screen.dart')
          source = path.read_text()
          anchor = "class AccountProtectionScreen extends StatefulWidget {"
          helper = """String _accountText(\n  BuildContext context, {\n  required String en,\n  required String tr,\n}) {\n  return Localizations.localeOf(context).languageCode == 'tr' ? tr : en;\n}\n\n"""
          if helper not in source:
              source = source.replace(anchor, helper + anchor, 1)

          replacements = [
              ("appBar: AppBar(title: const Text('Player account'))", "appBar: AppBar(\n        title: Text(_accountText(context, en: 'Player account', tr: 'Oyuncu hesabı')),\n      )"),
              ("'Account data'", "_accountText(context, en: 'Account data', tr: 'Hesap verileri')"),
              ("'Delete player account'", "_accountText(context, en: 'Delete player account', tr: 'Oyuncu hesabını sil')"),
              ("subtitle: const Text(\n                        'Permanently removes the server wallet, purchases, Friend ID, friends, ratings and match history.',\n                      )", "subtitle: Text(\n                        _accountText(\n                          context,\n                          en: 'Permanently removes the wallet, purchases, Friend ID, friends, ratings and match history.',\n                          tr: 'Cüzdanı, satın alımları, Arkadaş Kimliğini, arkadaşları, puanları ve maç geçmişini kalıcı olarak siler.',\n                        ),\n                      )"),
              ("? 'Sign in to a protected account'\n                  : 'Protect the current guest'", "? _accountText(context, en: 'Sign in to a protected account', tr: 'Korumalı hesaba giriş yap')\n                  : _accountText(context, en: 'Protect the current guest', tr: 'Mevcut misafir hesabını koru')"),
              ("? 'Open the same server wallet, Friend ID and rating on this device.'\n                  : 'Link email and password without changing the current Player ID, wallet, Friend ID, friends or rating.'", "? _accountText(context, en: 'Open the same wallet, Friend ID and rating on this device.', tr: 'Aynı cüzdanı, Arkadaş Kimliğini ve puanı bu cihazda aç.')\n                  : _accountText(context, en: 'Link email and password without changing the current Player ID, wallet, Friend ID, friends or rating.', tr: 'Mevcut Oyuncu Kimliğini, cüzdanı, Arkadaş Kimliğini, arkadaşları veya puanı değiştirmeden e-posta ve parola bağla.')"),
              ("decoration: const InputDecoration(\n                labelText: 'Email address',", "decoration: InputDecoration(\n                labelText: _accountText(context, en: 'Email address', tr: 'E-posta adresi'),"),
              ("labelText: 'Password',\n                helperText: 'At least 8 characters',", "labelText: _accountText(context, en: 'Password', tr: 'Parola'),\n                helperText: _accountText(context, en: 'At least 8 characters', tr: 'En az 8 karakter'),"),
              ("tooltip: _hidePassword ? 'Show password' : 'Hide password'", "tooltip: _hidePassword\n                      ? _accountText(context, en: 'Show password', tr: 'Parolayı göster')\n                      : _accountText(context, en: 'Hide password', tr: 'Parolayı gizle')"),
              ("labelText: 'Confirm password',", "labelText: _accountText(context, en: 'Confirm password', tr: 'Parolayı doğrula'),"),
              ("? 'Passwords do not match.'\n                      : null", "? _accountText(context, en: 'Passwords do not match.', tr: 'Parolalar eşleşmiyor.')\n                      : null"),
              ("? 'Please wait…'\n                    : _signInMode\n                    ? 'Sign in'\n                    : 'Protect this player account'", "? _accountText(context, en: 'Please wait…', tr: 'Lütfen bekleyin…')\n                    : _signInMode\n                    ? _accountText(context, en: 'Sign in', tr: 'Giriş yap')\n                    : _accountText(context, en: 'Protect this player account', tr: 'Bu oyuncu hesabını koru')"),
              ("child: const Text('Forgot password?')", "child: Text(_accountText(context, en: 'Forgot password?', tr: 'Parolanı mı unuttun?'))"),
              ("'Signing in switches away from the current guest. Guest and protected wallets are never merged.'", "_accountText(context, en: 'Signing in switches away from the current guest. Guest and protected wallets are never merged.', tr: 'Giriş yapmak mevcut misafir hesabından çıkış yapar. Misafir ve korumalı cüzdanlar birleştirilmez.')"),
              ("'Account protected'", "_accountText(context, en: 'Account protected', tr: 'Hesap korumalı')"),
              ("Text(user.email ?? 'Protected account')", "Text(user.email ?? _accountText(context, en: 'Protected account', tr: 'Korumalı hesap'))"),
              ("? 'Email verified'\n                    : 'Email verification required'", "? _accountText(context, en: 'Email verified', tr: 'E-posta doğrulandı')\n                    : _accountText(context, en: 'Email verification required', tr: 'E-posta doğrulaması gerekli')"),
              ("? 'Paid Coin purchases can be recovered on another device.'\n                    : 'Verify the email before buying Coins.'", "? _accountText(context, en: 'Paid Coin purchases can be recovered on another device.', tr: 'Ücretli Coin satın alımları başka bir cihazda geri yüklenebilir.')\n                    : _accountText(context, en: 'Verify the email before buying Coins.', tr: 'Coin satın almadan önce e-postayı doğrula.')"),
              ("label: const Text('Resend verification email')", "label: Text(_accountText(context, en: 'Resend verification email', tr: 'Doğrulama e-postasını yeniden gönder'))"),
              ("label: const Text('I verified it — refresh')", "label: Text(_accountText(context, en: 'I verified it — refresh', tr: 'Doğruladım — yenile'))"),
              ("label: const Text('Send password reset email')", "label: Text(_accountText(context, en: 'Send password reset email', tr: 'Parola sıfırlama e-postası gönder'))"),
              ("label: const Text('Sign out on this device')", "label: Text(_accountText(context, en: 'Sign out on this device', tr: 'Bu cihazda çıkış yap'))"),
              ("_notice = 'Protected player account opened.';", "_notice = _accountText(context, en: 'Protected player account opened.', tr: 'Korumalı oyuncu hesabı açıldı.');"),
              ("_notice = 'Account protected. Check your inbox to verify the email.';", "_notice = _accountText(context, en: 'Account protected. Check your inbox to verify the email.', tr: 'Hesap korundu. E-postayı doğrulamak için gelen kutunu kontrol et.');"),
              ("'Verification email sent.'", "_accountText(context, en: 'Verification email sent.', tr: 'Doğrulama e-postası gönderildi.')"),
              ("? 'Email verified.'\n        : 'Account refreshed.'", "? _accountText(context, en: 'Email verified.', tr: 'E-posta doğrulandı.')\n        : _accountText(context, en: 'Account refreshed.', tr: 'Hesap yenilendi.')"),
              ("'Password reset email sent.'", "_accountText(context, en: 'Password reset email sent.', tr: 'Parola sıfırlama e-postası gönderildi.')"),
              ("title: const Text('Sign out?')", "title: Text(_accountText(dialogContext, en: 'Sign out?', tr: 'Çıkış yapılsın mı?'))"),
              ("content: const Text(\n          'The protected wallet remains on the account. This device will use a separate guest until you sign in again.',\n        )", "content: Text(\n          _accountText(dialogContext, en: 'The protected wallet remains on the account. This device will use a separate guest until you sign in again.', tr: 'Korumalı cüzdan hesapta kalır. Tekrar giriş yapana kadar bu cihaz ayrı bir misafir hesabı kullanır.'),\n        )"),
              ("child: const Text('Cancel')", "child: Text(_accountText(dialogContext, en: 'Cancel', tr: 'İptal'))"),
              ("child: const Text('Sign out')", "child: Text(_accountText(dialogContext, en: 'Sign out', tr: 'Çıkış yap'))"),
              ("}, 'Guest player created.');", "}, _accountText(context, en: 'Guest player created.', tr: 'Misafir oyuncu oluşturuldu.'));"),
              ("title: const Text('Delete player account permanently?')", "title: Text(_accountText(dialogContext, en: 'Delete player account permanently?', tr: 'Oyuncu hesabı kalıcı olarak silinsin mi?'))"),
              ("const Text(\n                      'This cannot be undone. Coin balance, purchases, Friend ID, friends, ratings, challenges and match history will be removed. Finish or forfeit any active online match first.',\n                    )", "Text(\n                      _accountText(dialogContext, en: 'This cannot be undone. Coin balance, purchases, Friend ID, friends, ratings, challenges and match history will be removed. Finish or forfeit any active online match first.', tr: 'Bu işlem geri alınamaz. Coin bakiyesi, satın alımlar, Arkadaş Kimliği, arkadaşlar, puanlar, meydan okumalar ve maç geçmişi silinir. Önce aktif çevrimiçi maçı bitir veya hükmen kaybet.'),\n                    )"),
              ("decoration: const InputDecoration(\n                        labelText: 'Type DELETE',", "decoration: InputDecoration(\n                        labelText: _accountText(dialogContext, en: 'Type DELETE', tr: 'DELETE yazın'),"),
              ("labelText: 'Current password',", "labelText: _accountText(dialogContext, en: 'Current password', tr: 'Mevcut parola'),"),
              ("child: const Text('Delete permanently')", "child: Text(_accountText(dialogContext, en: 'Delete permanently', tr: 'Kalıcı olarak sil'))"),
              ("const SnackBar(\n          content: Text('Player account and server data deleted.'),\n        )", "SnackBar(\n          content: Text(_accountText(context, en: 'Player account and online data deleted.', tr: 'Oyuncu hesabı ve çevrimiçi veriler silindi.')),\n        )"),
              ("segments: const [", "segments: ["),
              ("label: Text('Protect current')", "label: Text(_accountText(context, en: 'Protect current', tr: 'Mevcut hesabı koru'))"),
              ("label: Text('Sign in')", "label: Text(_accountText(context, en: 'Sign in', tr: 'Giriş yap'))"),
              ("label: 'Protect current'", "label: _accountText(context, en: 'Protect current', tr: 'Mevcut hesabı koru')"),
              ("label: 'Sign in'", "label: _accountText(context, en: 'Sign in', tr: 'Giriş yap')"),
              ("protected ? 'Recoverable account' : 'Guest account'", "protected\n                        ? _accountText(context, en: 'Recoverable account', tr: 'Geri yüklenebilir hesap')\n                        : _accountText(context, en: 'Guest account', tr: 'Misafir hesabı')"),
              ("? 'Online identity linked to ${user?.email ?? 'an email account'}.'\n                        : 'Deleting the app or changing devices can make this guest inaccessible. Protect it before buying Coins.'", "? _accountText(context, en: 'Online identity linked to ${user?.email ?? 'an email account'}.', tr: 'Çevrimiçi kimlik ${user?.email ?? 'bir e-posta hesabına'} bağlandı.')\n                        : _accountText(context, en: 'Deleting the app or changing devices can make this guest inaccessible. Protect it before buying Coins.', tr: 'Uygulamayı silmek veya cihaz değiştirmek bu misafir hesabını erişilemez yapabilir. Coin satın almadan önce hesabı koru.')"),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Missing expected account copy: {old[:80]}')
              source = source.replace(old, new)

          path.write_text(source)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/settings/account_protection_screen.dart
      - run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: python3 tool/verify_ux_contracts.py
      - run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/settings/account_protection_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize account protection and deletion UX'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
