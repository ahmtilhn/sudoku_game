name: sudoku_game
description: A professional Sudoku career and online duel game built with Flutter.
publish_to: 'none'
version: 1.0.0+77
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_tracking_transparency: ^2.0.7
  audioplayers: ^6.8.1
  cupertino_icons: ^1.0.8
  firebase_analytics: ^12.4.5
  firebase_app_check: ^0.4.5+2
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  gma_mediation_unity: ^1.9.0
  google_mobile_ads: ^9.0.0
  http: ^1.6.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  in_app_purchase_storekit: ^0.4.11
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/avatar/
    - assets/emote/
    - assets/frames/
    - assets/rank/
    - assets/profile/
    - assets/profilecustomization/
    - assets/ELO_rating_icons/
    - assets/googleplayGameCenterleaderboardicon/
    - assets/puzzles/
    - assets/cards/
    - assets/logo/
    - assets/images/app_backdrop.png
    - assets/images/ui/
    - assets/images/ui/pro/
    - assets/localization/Localizable.xcstrings
    - assets/audio/ui/ui_click.mp3
    - assets/audio/ui/ui_back.mp3
    - assets/audio/gameplay/number_input.mp3
    - assets/audio/gameplay/correct_move.mp3
    - assets/audio/gameplay/wrong_move.mp3
    - assets/audio/online/countdown_tick.mp3
    - assets/audio/gameplay/unit_complete.mp3
    - assets/audio/gameplay/puzzle_complete.mp3
    - assets/audio/online/match_found.mp3
    - assets/audio/online/match_start.mp3
    - assets/audio/rewards/daily_reward_claim.mp3
    - assets/audio/economy/reward_x2.mp3
    - assets/audio/rank/elo_gain.mp3
    - assets/audio/rewards/achievement_unlocked.mp3
    - assets/audio/economy/coin_small.mp3
    - assets/audio/online/online_victory.mp3
    - assets/audio/online/online_defeat.mp3
