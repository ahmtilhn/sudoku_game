name: Validate prematch match terms

on:
  push:
    branches:
      - fix/prematch-match-terms

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/prematch-match-terms
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib/features/duel/matchmaking_screen.dart lib/features/duel/pre_match_ready_screen.dart lib/features/duel/prematch_match_terms_card.dart test/prematch_match_terms_contract_test.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Focused tests
        run: flutter test --reporter expanded test/prematch_match_terms_contract_test.dart test/online_duel_lifecycle_hotfix_test.dart
      - name: Full test suite
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 8m flutter test --reporter compact --concurrency=1
      - name: Remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/validate-prematch-match-terms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/validate-prematch-match-terms.yml
          git commit -m "Remove temporary prematch validation workflow"
          git push origin HEAD:fix/prematch-match-terms
