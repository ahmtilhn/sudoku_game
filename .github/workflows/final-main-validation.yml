name: Final main validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-main-validation.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-main-validation-0-1-9-22
  cancel-in-progress: false

jobs:
  validate-build-record:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_ENVIRONMENT: production
      BUILD_COMMIT: ${{ github.sha }}
      SOCIAL_BACKEND_URL: ${{ vars.PRODUCTION_SOCIAL_BACKEND_URL }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Capture source commit
        id: source
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/social_worker/package-lock.json

      - name: Resolve packages
        run: flutter pub get

      - name: Validate localization catalog
        run: python3 tool/validate_localizations.py

      - name: Verify user-safe messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Verify complete UX audit is current
        run: python3 tool/generate_ux_audit.py --check

      - name: Analyze with fatal infos
        run: flutter analyze --fatal-infos

      - name: Run and count all Flutter tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 12m \
            flutter test --machine --concurrency=1 2>&1 | tee /tmp/flutter-tests.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          count = 0
          failed = []
          for raw in Path('/tmp/flutter-tests.jsonl').read_text().splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('type') != 'testDone' or event.get('hidden') is True:
                  continue
              count += 1
              if event.get('result') not in {'success', 'skipped'}:
                  failed.append(event.get('testID'))
          if count == 0:
              raise SystemExit('No completed Flutter tests were counted.')
          if failed:
              raise SystemExit(f'Failed test IDs: {failed}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'count={count}\n')
          print(f'Validated Flutter tests: {count}')
          PY

      - name: Worker validation
        working-directory: backend/social_worker
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run puzzles:verify

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify Android release configuration
        shell: pwsh
        run: ./tool/verify_android_release_config.ps1

      - name: Require production backend URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOCIAL_BACKEND_URL"

      - name: Create ephemeral CI upload key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Sudoku Duel CI, OU=CI, O=Devovia, L=CI, ST=CI, C=NL"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF

      - name: Build production release AAB
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENVIRONMENT=${APP_ENVIRONMENT}
          --dart-define=SOCIAL_BACKEND_URL=${SOCIAL_BACKEND_URL}
          --dart-define=BUILD_COMMIT=${BUILD_COMMIT}

      - name: Inspect release AAB
        shell: pwsh
        run: |
          ./tool/verify_online_aab.ps1 `
            -Path "./build/app/outputs/bundle/release/app-release.aab"

      - name: Upload final debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-duel-0.1.9-22-debug-apk-final
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload final release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-duel-0.1.9-22-release-aab-final
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Write validated main record
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TEST_COUNT: ${{ steps.tests.outputs.count }}
        run: |
          set -euo pipefail
          rm -f android/key.properties android/ci-upload.jks
          cat > docs/final_validation.md <<EOF
          # Final Main Validation

          - Version: **0.1.9+22**
          - Validated source commit: \`$SOURCE_SHA\`
          - Localization catalog: **passed**
          - User-safe technical message guard: **passed**
          - UX contracts: **passed**
          - Complete UX audit freshness: **passed**
          - Flutter analyzer with fatal infos: **passed**
          - Flutter tests: **$TEST_COUNT passed**
          - Debug APK build: **passed**
          - Backend typecheck/tests/puzzle verification: **passed**
          - Production \`flutter build appbundle --release\` with explicit dart-defines: **passed**
          - Android release configuration inspection: **passed**
          - Release AAB content/signature inspection: **passed**
          - Debug artifact: \`sudoku-duel-0.1.9-22-debug-apk-final\`
          - Release artifact: \`sudoku-duel-0.1.9-22-release-aab-final\`

          The validation workflow uses an ephemeral CI upload certificate. Google Play continues to deliver production builds with the Play App Signing certificate.
          EOF

      - name: Commit validation record directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add docs/final_validation.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record green 0.1.9+22 main validation'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
