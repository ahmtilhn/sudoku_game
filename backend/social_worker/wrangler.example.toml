name = "sudoku-duel-social"
main = "src/main.ts"
compatibility_date = "2026-07-24"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
FCM_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
ALLOWED_ORIGIN = "*"
REQUIRE_APP_CHECK = "false"

[[d1_databases]]
binding = "DB"
database_name = "sudoku-duel-social"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCHMAKING_QUEUE"
class_name = "MatchmakingQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingQueue"]

# Add secrets with Wrangler; never commit their values:
# wrangler secret put FCM_CLIENT_EMAIL
# wrangler secret put FCM_PRIVATE_KEY
