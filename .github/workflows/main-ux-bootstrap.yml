name: Main UX bootstrap

on:
  schedule:
    - cron: '*/5 * * * *'
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: main-ux-bootstrap-2026-08-06
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[internal] Run main UX bootstrap 2026-08-06'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Reconstruct and apply audited UX patch
        shell: bash
        run: |
          set -euo pipefail
          cat tool/full_ux_bootstrap_parts/* \
            | base64 --decode \
            | gzip --decompress > /tmp/full-ux.patch
          echo 'c68936613438f74896b515413ce9433a9dfe1f53c89f2000c8a37e918e5d101e  /tmp/full-ux.patch' \
            | sha256sum --check
          git apply --check /tmp/full-ux.patch
          git apply /tmp/full-ux.patch

          python3 - <<'PY'
          from pathlib import Path

          audit = Path('docs/FULL_UX_AUDIT_2026-08.md')
          if audit.exists():
              audit.write_text(
                  '\n'.join(
                      line.rstrip()
                      for line in audit.read_text(encoding='utf-8').splitlines()
                  ) + '\n',
                  encoding='utf-8',
              )
          PY

          dart format lib test
          git diff --check

      - name: Resolve packages
        run: flutter pub get

      - name: Validate localization catalog
        run: python3 tool/validate_localizations.py

      - name: Verify user-facing messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Verify UX audit freshness
        run: python3 tool/generate_ux_audit.py --check

      - name: Analyze with fatal infos
        run: flutter analyze --fatal-infos

      - name: Run and count Flutter tests
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 15m \
            flutter test --machine --concurrency=1 2>&1 \
            | tee /tmp/flutter-tests.jsonl
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          count = 0
          failed = []
          for raw in Path('/tmp/flutter-tests.jsonl').read_text().splitlines():
              try:
                  event = json.loads(raw)
              except json.JSONDecodeError:
                  continue
              if event.get('type') != 'testDone' or event.get('hidden') is True:
                  continue
              count += 1
              if event.get('result') not in {'success', 'skipped'}:
                  failed.append(event.get('testID'))
          if count == 0:
              raise SystemExit('No completed Flutter tests were counted.')
          if failed:
              raise SystemExit(f'Failed test IDs: {failed}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'count={count}\n')
          print(f'Validated Flutter tests: {count}')
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify Google Play Billing dependency
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath \
            > /tmp/release-runtime-dependencies.txt
          grep -E 'com\.android\.billingclient:billing(-ktx)?(:| )' \
            /tmp/release-runtime-dependencies.txt

      - name: Verify Android release configuration
        shell: pwsh
        run: ./tool/verify_android_release_config.ps1

      - name: Create ephemeral CI upload key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=Sudoku Duel CI, OU=CI, O=Devovia, L=CI, ST=CI, C=NL'
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Inspect release AAB
        shell: pwsh
        run: |
          ./tool/verify_online_aab.ps1 `
            -Path './build/app/outputs/bundle/release/app-release.aab'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-game-main-ux-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-game-main-ux-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Commit validated changes directly to main
        shell: bash
        env:
          TEST_COUNT: ${{ steps.tests.outputs.count }}
        run: |
          set -euo pipefail
          rm -f android/key.properties android/ci-upload.jks
          rm -rf tool/full_ux_bootstrap_parts
          rm -f .github/workflows/main-ux-bootstrap.yml
          rm -f .github/workflows/apply-full-ux-overhaul.yml

          cat > docs/full_ux_validation.md <<EOF
          # Full UX Validation

          - Branch: **main**
          - Localization validation: **passed**
          - User-safe message verification: **passed**
          - UX contract verification: **passed**
          - UX audit freshness: **passed**
          - Flutter analyzer with fatal infos: **passed**
          - Flutter tests: **${TEST_COUNT} passed**
          - Debug APK: **passed**
          - Release AAB: **passed**
          - Release configuration inspection: **passed**
          - AAB content/signature inspection: **passed**
          EOF

          git add -A
          git diff --check --cached
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete gameplay profile and UX overhaul'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Close internal trigger issue
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: >-
          gh issue close "$ISSUE_NUMBER"
          --reason completed
          --comment 'Main UX patch passed all automated validation and was committed directly to main.'
