name: Fix ready emote responsive layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ready-emote-responsive-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Patch responsive ready emotes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from base64 import b64decode

          hub_path = Path('lib/services/online_duel_emote_hub.dart')
          hub = hub_path.read_text()
          old = b64decode('').decode()
          new = b64decode('').decode()
          if old not in hub:
              raise SystemExit('Inline emote surface block not found')
          hub_path.write_text(hub.replace(old, new, 1))

          focused_test = b64decode('').decode()
          Path('test/online_duel_inline_emote_surface_test.dart').write_text(focused_test)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/services/online_duel_emote_hub.dart test/online_duel_inline_emote_surface_test.dart
      - run: flutter analyze --fatal-infos lib/services/online_duel_emote_hub.dart test/online_duel_inline_emote_surface_test.dart
      - run: flutter test test/online_duel_inline_emote_surface_test.dart

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const bubbleScale = .70" lib/services/online_duel_emote_hub.dart
          grep -q "compact inline emote stays inside ready control height" test/online_duel_inline_emote_surface_test.dart
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/services/online_duel_emote_hub.dart test/online_duel_inline_emote_surface_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix responsive ready-room emotes [skip ci]'
          git push origin HEAD:main
