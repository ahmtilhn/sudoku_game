name: Fix challenge analyze errors

on:
  push:
    branches:
      - agent/challenge-system-hardening
    paths:
      - tool/fix_challenge_analyze_errors.py
      - .github/workflows/fix_challenge_analyze_errors.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/challenge-system-hardening' || github.ref_name == 'agent/challenge-system-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/challenge-system-hardening
          fetch-depth: 0
      - name: Apply analyzer fixes
        run: python tool/fix_challenge_analyze_errors.py
      - name: Remove temporary files
        run: |
          rm tool/fix_challenge_analyze_errors.py
          rm .github/workflows/fix_challenge_analyze_errors.yml
      - name: Commit analyzer fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix challenge hardening analyzer errors"
          git push origin HEAD:agent/challenge-system-hardening
