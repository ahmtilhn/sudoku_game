name: Apply settings compile fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-settings-cleanup-main.yml'

permissions:
  contents: write

concurrency:
  group: apply-settings-compile-fixes
  cancel-in-progress: false

jobs:
  fix-analyze-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fix stale settings and theme references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/features/home/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          text = text.replace("import '../settings/settings_screen.dart';", "import '../settings/ux_settings_screen.dart';")
          text = text.replace('SettingsScreen(store: widget.store)', 'UxSettingsScreen(store: widget.store)')
          home.write_text(text, encoding='utf-8')

          settings = Path('lib/features/settings/ux_settings_screen.dart')
          text = settings.read_text(encoding='utf-8').replace(
              'crossAxisSize: CrossAxisSize.stretch,',
              'crossAxisAlignment: CrossAxisAlignment.stretch,',
          )
          settings.write_text(text, encoding='utf-8')

          online_test = Path('test/online_duel_screen_test.dart')
          text = online_test.read_text(encoding='utf-8')
          text = text.replace(
              "theme: brightness == Brightness.dark\n            ? AppTheme.dark(highContrast: highContrast)\n            : AppTheme.light(highContrast: highContrast),",
              'theme: AppTheme.dark(),',
          )
          text = text.replace(
              'highContrast: highContrast,\n            textScaler:',
              'highContrast: highContrast,\n            platformBrightness: brightness,\n            textScaler:',
          )
          online_test.write_text(text, encoding='utf-8')

          ready_test = Path('test/pre_match_ready_emote_screen_test.dart')
          text = ready_test.read_text(encoding='utf-8').replace(
              'theme: AppTheme.light(highContrast: false),',
              'theme: AppTheme.dark(),',
          )
          ready_test.write_text(text, encoding='utf-8')

          settings_test = Path('test/settings_screen_test.dart')
          text = settings_test.read_text(encoding='utf-8')
          text = text.replace(
              "import 'package:sudoku_game/features/settings/settings_screen.dart';",
              "import 'package:sudoku_game/features/settings/ux_settings_screen.dart';",
          )
          text = text.replace(
              'MaterialApp(home: SettingsScreen(store: store))',
              'MaterialApp(home: UxSettingsScreen(store: store))',
          )
          text = text.replace(
              "    final titleText = strings.text('online_challenge_notifications');\n    final notificationTitle = find.text(titleText);\n    await tester.scrollUntilVisible(notificationTitle, 300);\n    await tester.pump();",
              "    await tester.tap(find.text(strings.text('notifications')).first);\n    await tester.pump();\n\n    final titleText = strings.text('online_challenge_notifications');\n    final notificationTitle = find.text(titleText);",
          )
          settings_test.write_text(text, encoding='utf-8')
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format and validate diff
        shell: bash
        run: |
          set -euo pipefail
          git restore -- pubspec.lock analysis_options.yaml || true
          dart format \
            lib/features/home/home_screen.dart \
            lib/features/settings/ux_settings_screen.dart \
            test/online_duel_screen_test.dart \
            test/pre_match_ready_emote_screen_test.dart \
            test/settings_screen_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Commit compile fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git restore -- pubspec.lock analysis_options.yaml || true
          git add \
            lib/features/home/home_screen.dart \
            lib/features/settings/ux_settings_screen.dart \
            test/online_duel_screen_test.dart \
            test/pre_match_ready_emote_screen_test.dart \
            test/settings_screen_test.dart
          if git diff --cached --quiet; then
            echo 'No compile fixes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix stale settings references after cleanup'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
