name: Temporary audio integration

on:
  push:
    branches:
      - feat/audio-feedback-integration-20260830
    paths:
      - '.github/workflows/tmp_audio_integration.yml'
      - 'tool/integrate_sound_feedback.py'
      - 'tool/fix_sound_integration.py'

permissions:
  contents: write

jobs:
  integrate_audio:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: feat/audio-feedback-integration-20260830
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Apply sound integration patches
        run: |
          python3 tool/integrate_sound_feedback.py
          python3 tool/fix_sound_integration.py

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Restore unrelated Flutter-generated config
        run: git checkout -- analysis_options.yaml

      - name: Format changed Dart sources
        run: |
          dart format \
            lib/main.dart \
            lib/services/sound_effects_service.dart \
            lib/localization/settings_strings.dart \
            lib/features/settings/ux_settings_screen.dart \
            lib/features/game/enhanced_game_screen.dart \
            lib/features/duel/online_ready_countdown_overlay.dart \
            lib/features/duel/pre_match_ready_screen.dart \
            lib/features/duel/online_duel_screen.dart \
            lib/services/online_duel_emote_hub.dart \
            lib/features/social/social_hub_screen.dart \
            test/sound_effects_integration_test.dart

      - name: Verify no whitespace errors
        run: git diff --check

      - name: Analyze Flutter project
        run: flutter analyze --fatal-infos

      - name: Run sound integration regression tests
        run: |
          flutter test --concurrency=1 \
            test/sound_effects_integration_test.dart \
            test/friendship_state_hardening_test.dart \
            test/recent_opponents_friend_flow_test.dart

      - name: Build debug APK with bundled sounds
        run: flutter build apk --debug

      - name: Verify sound assets are in APK
        shell: bash
        run: |
          set -euo pipefail
          unzip -l build/app/outputs/flutter-apk/app-debug.apk > /tmp/apk-files.txt
          grep -F 'flutter_assets/assets/audio/ui/ui_click.mp3' /tmp/apk-files.txt
          grep -F 'flutter_assets/assets/audio/gameplay/number_input.mp3' /tmp/apk-files.txt
          grep -F 'flutter_assets/assets/audio/online/online_victory.mp3' /tmp/apk-files.txt

      - name: Commit integrated sound system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pubspec.yaml pubspec.lock lib test
          git commit -m 'Integrate production sound feedback system'
          git push origin HEAD:feat/audio-feedback-integration-20260830
