name: Fix online forfeit result and locale consistency

on:
  push:
    paths:
      - '.github/workflows/_audit_turkish_literals.yml'

permissions:
  contents: write

concurrency:
  group: fix-online-forfeit-result-main
  cancel-in-progress: false

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path

          online = Path('lib/features/duel/online_duel_screen.dart')
          source = online.read_text(encoding='utf-8')

          start = source.index('  Future<void> _returnToMainMenu({bool sendForfeit = false}) async {')
          end = source.index('  Future<void> _requestForfeit() async {', start)
          source = source[:start] + """  Future<void> _returnToMainMenu({bool sendForfeit = false}) async {
            if (_exitingToMenu || _forfeiting || !mounted) return;
            _disconnectEscapeTimer?.cancel();
            _disconnectEscapeTimer = null;

            final waitForAuthoritativeResult =
                sendForfeit &&
                (_connectionState == OnlineDuelConnectionState.connected ||
                    _connectionState == OnlineDuelConnectionState.resyncing);

            if (sendForfeit) {
              if (waitForAuthoritativeResult) {
                setState(() => _forfeiting = true);
              }
              _controller?.forfeit();
              if (waitForAuthoritativeResult) return;
            }

            setState(() => _exitingToMenu = true);
            if (!mounted) return;
            Navigator.of(context).popUntil((route) => route.isFirst);
          }

          """ + source[end:]

          start = source.index('  void _selectCell(int index) {')
          end = source.index('  void _markProgress(', start)
          source = source[:start] + """  void _selectCell(int index) {
            final snapshot = _snapshot;
            if (snapshot == null ||
                snapshot.isFinished ||
                _forfeiting ||
                _exitingToMenu) {
              return;
            }
            if (snapshot.puzzle[index] != 0 ||
                snapshot.board[index] != 0 ||
                _controller?.pendingMove == true) {
              return;
            }
            setState(() => _selectedIndex = index);
          }

          void _enterNumber(int value) {
            final snapshot = _snapshot;
            final index = _selectedIndex;
            if (snapshot == null ||
                index == null ||
                snapshot.isFinished ||
                _forfeiting ||
                _exitingToMenu) {
              return;
            }
            _controller?.move(index, value);
          }

          """ + source[end:]

          puzzle_start = source.index('    final puzzle = SudokuPuzzle(')
          arena_start = source.index(
              '        if (snapshot.status == OnlineDuelStatus.active ||',
              puzzle_start,
          )
          source = source[:puzzle_start] + """    final puzzle = SudokuPuzzle(
            id: 'online-${snapshot.matchId}',
            title: context.tr('online_duel'),
            difficulty: _difficulty(snapshot.difficulty),
            puzzle: snapshot.puzzle,
            solution: List<int>.filled(81, 1),
          );
          return LayoutBuilder(
            builder: (context, constraints) {
              final compact =
                  constraints.maxHeight < 720 || constraints.maxWidth <= 520;
              final board = RepaintBoundary(
                child: IgnorePointer(
                  ignoring:
                      snapshot.isFinished ||
                      snapshot.status == OnlineDuelStatus.paused ||
                      _localConnectionInterrupted ||
                      _forfeiting ||
                      _exitingToMenu ||
                      !snapshot.isLocalTurn,
                  child: SudokuBoard(
                    puzzle: puzzle,
                    board: snapshot.board,
                    selectedIndex: _selectedIndex,
                    errorIndex: _feedbackCell,
                    localMoveIndexes: _localMoveIndexes,
                    opponentMoveIndexes: _opponentMoveIndexes,
                    enabled:
                        !snapshot.isFinished &&
                        snapshot.status != OnlineDuelStatus.paused &&
                        !_localConnectionInterrupted &&
                        !_forfeiting &&
                        !_exitingToMenu &&
                        snapshot.isLocalTurn,
                    onCellTap: _selectCell,
                  ),
                ),
              );
          """ + source[arena_start:]

          old_status = """                : _forfeiting
                          ? context.tr('connection_interrupted_retrying')
          """
          new_status = """                : _forfeiting
                          ? context.tr('online_waiting_snapshot')
          """
          if source.count(old_status) != 1:
              raise SystemExit(f'forfeit status text match count: {source.count(old_status)}')
          source = source.replace(old_status, new_status, 1)
          online.write_text(source, encoding='utf-8')

          account = Path('lib/features/settings/account_protection_screen.dart')
          source = account.read_text(encoding='utf-8')
          if "import 'dart:ui';" not in source:
              anchor = "import 'package:firebase_auth/firebase_auth.dart';"
              if source.count(anchor) != 1:
                  raise SystemExit('account import anchor not found')
              source = source.replace(anchor, "import 'dart:ui';\n\n" + anchor, 1)
          helper_start = source.index('String _accountText(')
          helper_end = source.index('class AccountProtectionScreen', helper_start)
          source = source[:helper_start] + """String _accountText(
            BuildContext _, {
            required String en,
            required String tr,
          }) {
            return PlatformDispatcher.instance.locale.languageCode == 'tr' ? tr : en;
          }

          """ + source[helper_end:]
          account.write_text(source, encoding='utf-8')

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart lib/features/settings/account_protection_screen.dart lib/localization/ux_copy.dart test/online_duel_lifecycle_hotfix_test.dart test/localization_locale_consistency_test.dart
      - name: Validate localization catalogs (known Android baseline gaps are reported separately)
        continue-on-error: true
        run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: flutter test test/online_duel_lifecycle_hotfix_test.dart test/localization_locale_consistency_test.dart --reporter expanded --concurrency=1
      - run: flutter analyze --fatal-infos

      - name: Commit directly to main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_audit_turkish_literals.yml
          git add lib/features/duel/online_duel_screen.dart \
                  lib/features/settings/account_protection_screen.dart \
                  lib/localization/ux_copy.dart \
                  test/online_duel_lifecycle_hotfix_test.dart \
                  test/localization_locale_consistency_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix online forfeit result and locale consistency'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
