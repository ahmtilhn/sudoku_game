name: Finalize responsive UI branch

on:
  push:
    branches: [responsive-nonscroll-ui]
    paths:
      - '.github/workflows/integrate-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: responsive-nonscroll-ui
          fetch-depth: 0

      - name: Fetch current main
        run: git fetch origin main

      - name: Restore responsive scroll Coin Store
        shell: bash
        run: |
          set -euo pipefail
          git checkout origin/main -- \
            lib/features/economy/coin_store_screen.dart \
            test/responsive_feedback_ux_test.dart

          python3 - <<'PY'
          from pathlib import Path

          store = Path('lib/features/economy/coin_store_screen.dart').read_text()
          required = [
              'RefreshIndicator(',
              'CustomScrollView(',
              'AlwaysScrollableScrollPhysics()',
              'constraints.maxWidth >= 900',
              'constraints.maxWidth >= 560',
              'final horizontalPadding = constraints.maxWidth < 360',
              'final gridAspectRatio = columns == 1',
              'final stacked = constraints.maxWidth < 380',
              'overflow: TextOverflow.ellipsis',
          ]
          missing = [item for item in required if item not in store]
          if missing:
              raise SystemExit(f'Coin Store responsive scroll contract missing: {missing}')
          if '_productPage' in store or 'NeverScrollableScrollPhysics()' in store:
              raise SystemExit('Coin Store still contains the temporary non-scroll pagination implementation')

          targets = [
              'lib/features/home/professional_home_screen.dart',
              'lib/features/career/career_hub_screen.dart',
              'lib/features/economy/wallet_history_screen.dart',
              'lib/features/game/enhanced_game_screen.dart',
              'lib/features/game/game_screen.dart',
              'lib/features/settings/ux_settings_screen.dart',
              'lib/features/settings/account_protection_screen.dart',
              'lib/features/settings/service_diagnostics_screen.dart',
              'lib/features/social/profile_customization_screen.dart',
              'lib/features/social/profile_hub_screen.dart',
              'lib/features/tutorial/tutorial_screen.dart',
          ]
          forbidden = (
              'SingleChildScrollView(',
              'CustomScrollView(',
              'ListView(',
              'ListView.builder(',
              'ListView.separated(',
              'RefreshIndicator(',
          )
          for relative in targets:
              text = Path(relative).read_text()
              if relative.endswith('professional_home_screen.dart'):
                  text = text.split('class _DailyRewardDialog', 1)[0]
              if relative.endswith('enhanced_game_screen.dart'):
                  text = text.split('class _GameResultSheet', 1)[0]
              for marker in forbidden:
                  if marker in text:
                      raise SystemExit(f'{relative}: unexpected page scroll marker {marker}')
          print('Responsive contracts verified: Coin Store scrolls; other scoped pages do not.')
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format and analyze
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/home/professional_home_screen.dart \
            lib/features/career/career_hub_screen.dart \
            lib/features/economy/coin_store_screen.dart \
            lib/features/economy/wallet_history_screen.dart \
            lib/features/game/enhanced_game_screen.dart \
            lib/features/game/game_screen.dart \
            lib/features/settings/ux_settings_screen.dart \
            lib/features/settings/account_protection_screen.dart \
            lib/features/settings/service_diagnostics_screen.dart \
            lib/features/social/profile_customization_screen.dart \
            lib/features/social/profile_hub_screen.dart \
            lib/features/tutorial/tutorial_screen.dart \
            test/widget_test.dart \
            test/career_variant_progress_test.dart \
            test/profile_hub_artwork_layout_test.dart \
            test/responsive_feedback_ux_test.dart
          flutter analyze --no-fatal-infos

      - name: Focused responsive regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test \
            test/widget_test.dart \
            test/career_variant_progress_test.dart \
            test/profile_hub_artwork_layout_test.dart \
            test/responsive_feedback_ux_test.dart \
            --reporter expanded --concurrency=1

      - name: Clean temporary responsive tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tool/responsive_patches
          rm -f tool/verify_non_scroll_layouts.py
          rm -f \
            .github/workflows/finalize-responsive-home.yml \
            .github/workflows/finalize-responsive-home-v2.yml \
            .github/workflows/finalize-responsive-home-v3.yml \
            .github/workflows/offline-responsive-diagnostics.yml \
            .github/workflows/responsive-nonscroll-ui.yml \
            .github/workflows/integrate-current-main.yml

      - name: Commit final validated branch
        shell: bash
        run: |
          set -euo pipefail
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize responsive offline UI and restore scrollable Coin Store'
          fi
          git push origin HEAD:responsive-nonscroll-ui
