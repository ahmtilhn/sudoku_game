name: Localize all user copy on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-all-user-copy-main.yml'
      - 'tool/localize_all_user_copy.py'
      - 'tool/localize_remaining_presentation_copy.py'
      - 'tool/localize_final_presentation_copy.py'
      - 'tool/localize_user_safe_errors.py'
      - 'tool/localize_non_widget_user_copy.py'
      - 'tool/fix_localization_dart_escapes.py'
      - 'tool/fix_percent_localization_literals.py'
      - 'tool/verify_localized_user_copy.py'
      - 'tool/verify_user_facing_messages.py'
      - 'tool/verify_non_widget_user_copy.py'
      - 'tool/sync_missing_ios_localization_keys.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: localize-all-user-copy-main
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Resolve social worker packages
        working-directory: backend/social_worker
        run: npm ci

      - name: Migrate remaining user copy
        run: python3 tool/localize_all_user_copy.py

      - name: Migrate remaining presentation literals
        run: python3 tool/localize_remaining_presentation_copy.py

      - name: Close final presentation gaps
        run: python3 tool/localize_final_presentation_copy.py

      - name: Map user-facing errors safely
        run: python3 tool/localize_user_safe_errors.py

      - name: Centralize notifications reminders and accessibility copy
        run: python3 tool/localize_non_widget_user_copy.py

      - name: Normalize percent localization literals
        run: python3 tool/fix_percent_localization_literals.py

      - name: Normalize Dart localization escapes
        run: python3 tool/fix_localization_dart_escapes.py

      - name: Sync pre-existing iOS localization gaps
        run: python3 tool/sync_missing_ios_localization_keys.py

      - name: Format changed Dart sources
        run: >-
          dart format
          lib/localization
          lib/models/avatar_preset_catalog.dart
          lib/models/country_catalog.dart
          lib/models/online_duel_emote_catalog.dart
          lib/models/rank_identity_fallback.dart
          lib/services/online_duel_emote_hub.dart
          lib/services/push_notification_service.dart
          lib/services/reminder_message_catalog.dart
          lib/services/reminder_notification_service.dart
          lib/widgets/rank_emblem.dart
          lib/features/career/career_hub_screen.dart
          lib/features/duel/leaderboards_screen.dart
          lib/features/duel/matchmaking_stage.dart
          lib/features/duel/online_duel_screen.dart
          lib/features/duel/pre_match_ready_screen.dart
          lib/features/duel/ranked_progress_screen.dart
          lib/features/home/ux_root_screen.dart
          lib/features/social/challenge_invitation_screen.dart
          lib/features/social/challenge_waiting_screen.dart
          lib/features/social/emote_loadout_screen.dart
          lib/features/social/platform_services_screen.dart
          lib/features/social/platform_social_screen.dart
          lib/features/social/player_identity_gate.dart
          lib/features/social/profile_customization_screen.dart
          lib/features/social/profile_hub_screen.dart
          lib/features/social/rank_identity_summary_card.dart
          lib/features/social/rematch_invitation_screen.dart
          lib/features/social/social_hub_screen.dart
          lib/features/social/ux_challenge_invitation_screen.dart

      - name: Validate localization catalogs
        run: python3 tool/validate_localizations.py

      - name: Verify localized presentation copy
        run: python3 tool/verify_localized_user_copy.py

      - name: Verify user-safe messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify non-widget user copy
        run: python3 tool/verify_non_widget_user_copy.py

      - name: Typecheck social worker
        working-directory: backend/social_worker
        run: npm run typecheck

      - name: Refresh UX audit
        run: python3 tool/generate_ux_audit.py --write

      - name: Analyze Flutter
        run: flutter analyze --fatal-infos

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add \
            lib \
            android/app/src/main/res/values/strings.xml \
            assets/localization/Localizable.xcstrings \
            ios/Runner.xcodeproj/project.pbxproj \
            backend/social_worker/src \
            tool/verify_localized_user_copy.py \
            .github/workflows/mobile-ci.yml \
            docs/ux_audit.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Localization migration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Centralize remaining user-facing copy'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
