name: Temporary Turkish Literal Audit

on:
  push:
    paths:
      - '.github/workflows/_audit_turkish_literals.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan Dart source for Turkish literals
        shell: bash
        run: |
          echo '=== Turkish-specific characters in lib/**/*.dart ==='
          grep -RInE --include='*.dart' '[çğıöşüÇĞİÖŞÜ]' lib || true
          echo '=== Common Turkish UI words in lib/**/*.dart ==='
          grep -RInEi --include='*.dart' "(kaybettin|kazandın|kazandin|iptal|tamam|devam|maç|mac |rakip|oyuncu|bağlantı|baglanti|hazır|hazir|bekle|çık|cik|ana menü|ana menu|yeniden|hata|başar|basar|puan|sıra|sira|hamle|oyun bitti)" lib || true
