name: Fix online forfeit result and locale consistency

on:
  push:
    paths:
      - '.github/workflows/_audit_turkish_literals.yml'

permissions:
  contents: write

concurrency:
  group: fix-online-forfeit-result-main
  cancel-in-progress: false

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply source fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(source, old, new, label):
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return source.replace(old, new, 1)

          online = Path('lib/features/duel/online_duel_screen.dart')
          source = online.read_text(encoding='utf-8')

          old_return = """  Future<void> _returnToMainMenu({bool sendForfeit = false}) async {
            if (_exitingToMenu || !mounted) return;
            _disconnectEscapeTimer?.cancel();
            _disconnectEscapeTimer = null;
            setState(() {
              _exitingToMenu = true;
              if (sendForfeit) _forfeiting = true;
            });

            if (sendForfeit) {
              _controller?.forfeit();
              if (_connectionState == OnlineDuelConnectionState.connected ||
                  _connectionState == OnlineDuelConnectionState.resyncing) {
                await Future<void>.delayed(const Duration(milliseconds: 180));
              }
            }

            if (!mounted) return;
            Navigator.of(context).popUntil((route) => route.isFirst);
          }
          """
          new_return = """  Future<void> _returnToMainMenu({bool sendForfeit = false}) async {
            if (_exitingToMenu || _forfeiting || !mounted) return;
            _disconnectEscapeTimer?.cancel();
            _disconnectEscapeTimer = null;

            final waitForAuthoritativeResult =
                sendForfeit &&
                (_connectionState == OnlineDuelConnectionState.connected ||
                    _connectionState == OnlineDuelConnectionState.resyncing);

            if (sendForfeit) {
              if (waitForAuthoritativeResult) {
                setState(() => _forfeiting = true);
              }
              _controller?.forfeit();
              if (waitForAuthoritativeResult) return;
            }

            setState(() => _exitingToMenu = true);
            if (!mounted) return;
            Navigator.of(context).popUntil((route) => route.isFirst);
          }
          """
          source = replace_once(source, old_return, new_return, '_returnToMainMenu')

          source = replace_once(
              source,
              """    if (snapshot == null || snapshot.isFinished) {
                return;
              }
          """,
              """    if (snapshot == null ||
                  snapshot.isFinished ||
                  _forfeiting ||
                  _exitingToMenu) {
                return;
              }
          """,
              '_selectCell guard',
          )

          source = replace_once(
              source,
              """            ignoring:
                          snapshot.isFinished ||
                          snapshot.status == OnlineDuelStatus.paused ||
                          _localConnectionInterrupted ||
                          !snapshot.isLocalTurn,
          """,
              """            ignoring:
                          snapshot.isFinished ||
                          snapshot.status == OnlineDuelStatus.paused ||
                          _localConnectionInterrupted ||
                          _forfeiting ||
                          _exitingToMenu ||
                          !snapshot.isLocalTurn,
          """,
              'board IgnorePointer',
          )

          source = replace_once(
              source,
              """              enabled:
                          !snapshot.isFinished &&
                          snapshot.status != OnlineDuelStatus.paused &&
                          !_localConnectionInterrupted &&
                          snapshot.isLocalTurn,
          """,
              """              enabled:
                          !snapshot.isFinished &&
                          snapshot.status != OnlineDuelStatus.paused &&
                          !_localConnectionInterrupted &&
                          !_forfeiting &&
                          !_exitingToMenu &&
                          snapshot.isLocalTurn,
          """,
              'board enabled',
          )

          source = replace_once(
              source,
              """                : _forfeiting
                          ? context.tr('connection_interrupted_retrying')
          """,
              """                : _forfeiting
                          ? context.tr('online_waiting_snapshot')
          """,
              'forfeit status text',
          )

          source = replace_once(
              source,
              "title: 'Online Duel',",
              "title: context.tr('online_duel'),",
              'online puzzle title',
          )
          online.write_text(source, encoding='utf-8')

          account = Path('lib/features/settings/account_protection_screen.dart')
          source = account.read_text(encoding='utf-8')
          source = replace_once(
              source,
              "import 'package:firebase_auth/firebase_auth.dart';",
              "import 'dart:ui';\n\nimport 'package:firebase_auth/firebase_auth.dart';",
              'account dart:ui import',
          )
          source = replace_once(
              source,
              """String _accountText(
            BuildContext context, {
            required String en,
            required String tr,
          }) {
            return Localizations.localeOf(context).languageCode == 'tr' ? tr : en;
          }
          """,
              """String _accountText(
            BuildContext _, {
            required String en,
            required String tr,
          }) {
            return PlatformDispatcher.instance.locale.languageCode == 'tr' ? tr : en;
          }
          """,
              'account locale helper',
          )
          account.write_text(source, encoding='utf-8')

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart lib/features/settings/account_protection_screen.dart lib/localization/ux_copy.dart test/online_duel_lifecycle_hotfix_test.dart test/localization_locale_consistency_test.dart
      - run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: python3 tool/verify_duel_ui_contract.py
      - run: python3 tool/verify_result_screen_unified.py
      - run: flutter test test/online_duel_lifecycle_hotfix_test.dart test/localization_locale_consistency_test.dart --reporter expanded --concurrency=1
      - run: flutter analyze --fatal-infos

      - name: Commit directly to main and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/_audit_turkish_literals.yml
          git add lib/features/duel/online_duel_screen.dart \
                  lib/features/settings/account_protection_screen.dart \
                  lib/localization/ux_copy.dart \
                  test/online_duel_lifecycle_hotfix_test.dart \
                  test/localization_locale_consistency_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix online forfeit result and locale consistency'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
