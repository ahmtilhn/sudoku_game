name: Harden iOS localization tooling

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/patch-ios-turkish-verifier-main.yml'

concurrency:
  group: ios-localization-tooling-cleanup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Patch verifier and remove legacy workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          base_url = f'https://api.github.com/repos/{repo}/contents/'
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def call(method, path, payload=None, ref=False):
              url = base_url + urllib.parse.quote(path, safe='/')
              if ref:
                  url += '?ref=main'
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(request) as response:
                  raw = response.read()
              return json.loads(raw.decode('utf-8')) if raw else {}

          repair_path = 'tool/repair_ios_catalog_all_languages.py'
          repair = call('GET', repair_path, ref=True)
          source = base64.b64decode(repair['content']).decode('utf-8')
          old = "            actual = value_for(strings[key], locale)\n"
          new = "            definition = strings.get(key)\n            if not isinstance(definition, dict):\n                # Curated copy is optional metadata. Removed app keys are ignored here.\n                continue\n            actual = value_for(definition, locale)\n"
          if old in source:
              source = source.replace(old, new, 1)
              call('PUT', repair_path, {
                  'message': 'Harden iOS localization verification tooling',
                  'content': base64.b64encode(source.encode('utf-8')).decode('ascii'),
                  'sha': repair['sha'],
                  'branch': 'main',
              })
          elif 'definition = strings.get(key)' not in source:
              raise SystemExit('Expected curated verification access was not found.')

          workflow_path = '.github/workflows/patch-ios-turkish-verifier-main.yml'
          workflow = call('GET', workflow_path, ref=True)
          call('DELETE', workflow_path, {
              'message': 'Remove obsolete Turkish verifier patch workflow',
              'sha': workflow['sha'],
              'branch': 'main',
          })
          PY
