name: Apply friendship state hardening

on:
  push:
    branches:
      - fix/friendship-state-hardening-20260830
    paths:
      - 'tool/apply_friendship_state_hardening.py'
      - 'tool/apply_friendship_state_hardening_v2.py'
      - '.github/workflows/apply-friendship-state-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: friendship-state-hardening-20260830
  cancel-in-progress: false

jobs:
  apply-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/friendship-state-hardening-20260830
          fetch-depth: 0

      - name: Apply friendship hardening patch
        run: python3 tool/apply_friendship_state_hardening_v2.py

      - name: Backend dependencies
        working-directory: backend/social_worker
        run: npm ci

      - name: Backend typecheck
        working-directory: backend/social_worker
        run: npm run typecheck

      - name: Backend tests
        working-directory: backend/social_worker
        run: npm test

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/social/social_hub_screen.dart \
            lib/features/social/platform_social_screen.dart \
            lib/features/duel/online_duel_screen.dart \
            test/friendship_state_hardening_test.dart
          git diff --check

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Friendship regression tests
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded --concurrency=1 \
            test/recent_opponents_friend_flow_test.dart \
            test/friendship_state_hardening_test.dart

      - name: Remove one-shot patch helpers
        shell: bash
        run: |
          rm -f tool/apply_friendship_state_hardening.py
          rm -f tool/apply_friendship_state_hardening_v2.py
          rm -f .github/workflows/apply-friendship-state-hardening.yml

      - name: Commit verified friendship hardening
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden friendship request state machine'
          git fetch origin fix/friendship-state-hardening-20260830
          git rebase origin/fix/friendship-state-hardening-20260830
          git push origin HEAD:fix/friendship-state-hardening-20260830
