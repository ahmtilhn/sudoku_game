name: Flutter checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve packages
        continue-on-error: true
        run: flutter pub get > ci.log 2>&1
      - name: Format sources
        continue-on-error: true
        run: dart format lib test >> ci.log 2>&1
      - name: Analyze
        continue-on-error: true
        run: flutter analyze >> ci.log 2>&1
      - name: Test
        continue-on-error: true
        run: flutter test >> ci.log 2>&1
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-log
          path: ci.log
          if-no-files-found: warn
