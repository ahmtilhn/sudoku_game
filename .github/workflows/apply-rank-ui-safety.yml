name: Apply rank UI safety fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-rank-ui-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rank-ui-safety
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply exact user-safe error fixes
        shell: python
        run: |
          from pathlib import Path

          profile = Path('lib/features/social/profile_customization_screen.dart')
          text = profile.read_text()
          old = "import 'package:flutter/material.dart';\n\nimport '../../models/avatar_preset_catalog.dart';"
          new = "import 'package:flutter/material.dart';\n\nimport '../../core/user_safe_error.dart';\nimport '../../models/avatar_preset_catalog.dart';"
          if old not in text:
              raise SystemExit('profile import anchor missing')
          text = text.replace(old, new, 1)
          count = text.count("if (mounted) setState(() => _error = error.toString());")
          if count != 2:
              raise SystemExit(f'expected 2 profile raw-error sites, found {count}')
          text = text.replace(
              "if (mounted) setState(() => _error = error.toString());",
              "if (mounted) {\n        setState(() => _error = UserSafeError.message(context, error));\n      }",
          )
          profile.write_text(text)

          board = Path('lib/features/duel/leaderboards_screen.dart')
          text = board.read_text()
          old = "import 'package:flutter/material.dart';\n\nimport '../../models/rank_identity_models.dart';"
          new = "import 'package:flutter/material.dart';\n\nimport '../../core/user_safe_error.dart';\nimport '../../models/rank_identity_models.dart';"
          if old not in text:
              raise SystemExit('leaderboard import anchor missing')
          text = text.replace(old, new, 1)
          old_error = "if (mounted) setState(() => _error = error.toString());"
          if text.count(old_error) != 1:
              raise SystemExit('expected exactly one leaderboard raw-error site')
          text = text.replace(
              old_error,
              "if (mounted) {\n        setState(() => _error = UserSafeError.message(context, error));\n      }",
              1,
          )
          old_progress = "value: profile.progress.clamp(0.0, 1.0),"
          if old_progress not in text:
              raise SystemExit('leaderboard progress anchor missing')
          text = text.replace(
              old_progress,
              "value: profile.progress.clamp(0.0, 1.0).toDouble(),",
              1,
          )
          board.write_text(text)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format changed files
        run: dart format lib/features/social/profile_customization_screen.dart lib/features/duel/leaderboards_screen.dart

      - name: Validate user-facing and localization contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_localizations.py
          python3 tool/verify_user_facing_messages.py
          python3 tool/verify_ux_contracts.py
          git diff --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit verified changes directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/social/profile_customization_screen.dart lib/features/duel/leaderboards_screen.dart
          if git diff --cached --quiet; then
            echo 'Safety fixes already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Use user-safe errors in rank profile UI'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
