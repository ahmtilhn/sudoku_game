name: Fast final RP visibility guard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-rank-visibility-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-rank-visibility-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply presentation and rated-mode guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          stage = Path('lib/features/duel/matchmaking_stage.dart')
          text = stage.read_text(encoding='utf-8')
          text = text.replace(
              "            label: context.tr('rating'),\n",
              "            // Public matchup cards expose Rank Points, never hidden MMR.\n            label: 'RP',\n",
              1,
          )
          for old, new in {
              "    this.rating,\n": "    this.rankPoints,\n",
              "  final int? rating;\n": "  final int? rankPoints;\n",
              "    int? rating,\n": "    int? rankPoints,\n",
              "      rating: rating ?? this.rating,\n": "      rankPoints: rankPoints ?? this.rankPoints,\n",
              "            value: player.rating?.toString() ?? '—',\n": "            value: player.rankPoints?.toString() ?? '—',\n",
          }.items():
              text = text.replace(old, new)
          if "final int? rankPoints;" not in text or "label: 'RP'," not in text:
              raise SystemExit('matchmaking visible-RP conversion failed')
          if "final int? rating;" in text or "player.rating" in text or "context.tr('rating')" in text:
              raise SystemExit('legacy public rating presentation remains')
          stage.write_text(text, encoding='utf-8')

          matchmaking = Path('lib/features/duel/matchmaking_screen.dart')
          text = matchmaking.read_text(encoding='utf-8')
          text = text.replace(
              "      // Legacy presentation slot: visible RP only, never matchmaking MMR.\n      rating: profile.rankPoints,\n",
              "      rankPoints: profile.rankPoints,\n",
          )
          if "rating: profile.rankPoints" in text:
              raise SystemExit('matchmaking callsite conversion failed')
          matchmaking.write_text(text, encoding='utf-8')

          prematch = Path('lib/features/duel/pre_match_ready_screen.dart')
          text = prematch.read_text(encoding='utf-8')
          text = text.replace(
              "          // Legacy presentation slot, now populated with visible RP only.\n          rating: profile.rankPoints,\n",
              "          rankPoints: profile.rankPoints,\n",
          )
          text = text.replace("      rating: base?.rating,\n", "      rankPoints: base?.rankPoints,\n")
          text = text.replace(
              "      rating: profileMatches ? publicProfile.rankPoints : null,\n",
              "      rankPoints: profileMatches ? publicProfile.rankPoints : null,\n",
          )
          if "base?.rating" in text or "rating: profile.rankPoints" in text:
              raise SystemExit('pre-match callsite conversion failed')
          prematch.write_text(text, encoding='utf-8')

          progression = Path('backend/social_worker/src/rank_progression.ts')
          text = progression.read_text(encoding='utf-8')
          text = text.replace(
              "       AND m.rated = 1\n       AND m.finished_at IS NOT NULL",
              "       AND m.rated = 1\n       AND m.mode = 'ranked'\n       AND m.finished_at IS NOT NULL",
              1,
          )
          if "AND m.mode = 'ranked'" not in text:
              raise SystemExit('ranked-only RP reconciliation guard missing')
          progression.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Targeted Flutter validation
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/features/duel/matchmaking_stage.dart \
            lib/features/duel/matchmaking_screen.dart \
            lib/features/duel/pre_match_ready_screen.dart
          flutter analyze --fatal-infos
          flutter test \
            test/rank_identity_catalog_test.dart \
            test/rank_public_surface_contract_test.dart \
            test/matchmaking_stage_animation_test.dart \
            --reporter expanded --concurrency=1

      - name: Targeted backend validation
        working-directory: backend/social_worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npx vitest run test/rank_progression.test.ts test/rank_post_settlement_contract.test.ts

      - name: Commit validated guard to main
        shell: bash
        run: |
          set -euo pipefail
          git add \
            lib/features/duel/matchmaking_stage.dart \
            lib/features/duel/matchmaking_screen.dart \
            lib/features/duel/pre_match_ready_screen.dart \
            backend/social_worker/src/rank_progression.ts
          if git diff --cached --quiet; then
            echo 'RP visibility guard already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate visible RP from hidden matchmaking MMR'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
