name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'docs/ux_audit.md'
      - 'android/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tool/**'
      - 'docs/ux_audit.md'
      - 'android/**'
      - 'ios/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compare every remote branch with main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --all --prune
          printf 'branch\tahead\tbehind\tancestor_of_main\tunique_patches\tlatest_commit\n' > branch-audit.tsv
          while IFS= read -r ref; do
            branch="${ref#refs/remotes/origin/}"
            case "$branch" in
              HEAD|main) continue ;;
            esac
            ahead="$(git rev-list --count origin/main.."$ref")"
            behind="$(git rev-list --count "$ref"..origin/main)"
            if git merge-base --is-ancestor "$ref" origin/main; then
              ancestor=yes
            else
              ancestor=no
            fi
            unique="$(git cherry origin/main "$ref" | awk '$1 == "+" {count++} END {print count+0}')"
            latest="$(git log -1 --format='%h %s' "$ref" | tr '\t\r\n' '   ')"
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
              "$branch" "$ahead" "$behind" "$ancestor" "$unique" "$latest" \
              >> branch-audit.tsv
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin | sort)
          column -t -s $'\t' branch-audit.tsv || cat branch-audit.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: branch-audit
          path: branch-audit.tsv
          if-no-files-found: error
          retention-days: 14

  flutter-static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter environment
        run: flutter doctor -v

      - name: Resolve packages
        run: flutter pub get

      - name: Validate localization catalog
        run: python3 tool/validate_localizations.py

      - name: Verify user-safe messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Verify complete UX audit is current
        run: python3 tool/generate_ux_audit.py --check

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 8m \
            flutter test --coverage --reporter expanded --concurrency=1

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  android-debug-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: flutter-static
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
