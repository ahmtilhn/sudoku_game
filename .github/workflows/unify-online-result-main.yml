name: Fix ready room emote availability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-online-result-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Align ready-room emote availability with send path
        shell: python
        run: |
          from pathlib import Path

          ready_path = Path('lib/features/duel/pre_match_ready_screen.dart')
          ready = ready_path.read_text()
          old = "\n".join([
              '    return opponent != null &&',
              '        opponent.publicId.trim().isNotEmpty &&',
              '        status != null &&',
              '        onlineDuelStatusAllowsEmotes(status) &&',
              '        _connectionState == OnlineDuelConnectionState.connected;',
          ])
          new = "\n".join([
              '    final connectionUsable =',
              '        _connectionState == OnlineDuelConnectionState.connected ||',
              '        _connectionState == OnlineDuelConnectionState.resyncing;',
              '    return opponent != null &&',
              '        opponent.publicId.trim().isNotEmpty &&',
              '        status != null &&',
              '        onlineDuelStatusAllowsEmotes(status) &&',
              '        connectionUsable;',
          ])
          if old not in ready:
              raise SystemExit('Ready emote visibility block not found')
          ready_path.write_text(ready.replace(old, new, 1))

          controller_path = Path('lib/services/online_duel_controller.dart')
          controller = controller_path.read_text()
          old = "\n".join([
              '    OnlineDuelEmoteHub.instance.setMatchActive(',
              '      session,',
              '      _transport.connectionState == OnlineDuelConnectionState.connected &&',
              '          onlineDuelStatusAllowsEmotes(snapshot.status),',
              '    );',
          ])
          new = "\n".join([
              '    final connectionState = _transport.connectionState;',
              '    OnlineDuelEmoteHub.instance.setMatchActive(',
              '      session,',
              '      (connectionState == OnlineDuelConnectionState.connected ||',
              '              connectionState == OnlineDuelConnectionState.resyncing) &&',
              '          onlineDuelStatusAllowsEmotes(snapshot.status),',
              '    );',
          ])
          if old not in controller:
              raise SystemExit('Controller emote availability block not found')
          controller_path.write_text(controller.replace(old, new, 1))

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/pre_match_ready_screen.dart lib/services/online_duel_controller.dart
      - run: flutter analyze --fatal-infos lib/features/duel/pre_match_ready_screen.dart lib/services/online_duel_controller.dart

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "connectionUsable" lib/features/duel/pre_match_ready_screen.dart
          grep -q "connectionState == OnlineDuelConnectionState.resyncing" lib/services/online_duel_controller.dart
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/pre_match_ready_screen.dart lib/services/online_duel_controller.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow ready-room emotes while resyncing [skip ci]'
          git push origin HEAD:main
