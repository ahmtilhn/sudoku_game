name: sudoku_game
description: A professional Sudoku career and online duel game built with Flutter.
publish_to: 'none'
version: 1.0.0+49
environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_tracking_transparency: ^2.0.7
  cupertino_icons: ^1.0.8
  firebase_analytics: ^12.4.5
  firebase_app_check: ^0.4.5+2
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  gma_mediation_unity: ^1.9.0
  google_mobile_ads: ^9.0.0
  http: ^1.6.0
  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.2
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.11.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences_platform_interface: ^2.4.2

flutter:
  uses-material-design: true
  assets:
    - assets/puzzles/
    - assets/images/app_backdrop.png
    - assets/images/ui/
    - assets/localization/Localizable.xcstrings
