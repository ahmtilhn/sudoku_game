name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/social_worker/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/social_worker/**'

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend/social_worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/social_worker/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Verify ranked puzzle catalog
        run: npm run puzzles:verify

      - name: Validate production invariants example
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: ./scripts/check_production_invariants.ps1 -ConfigPath backend/social_worker/wrangler.production.example.toml -AllowPlaceholders
