name: Apply challenge navigation integration

on:
  push:
    branches:
      - fix/challenge-push-leaderboards
    paths:
      - .github/workflows/apply_challenge_flow_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/challenge-push-leaderboards
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch challenge routes and social notification UX
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Missing required text in {path}: {old[:90]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          root = Path('lib/features/home/ux_root_screen.dart')
          replace_once(
              root,
              "import '../duel/matchmaking_screen.dart';\nimport '../duel/online_duel_screen.dart';",
              "import '../duel/matchmaking_screen.dart';\nimport '../duel/online_duel_screen.dart';\nimport '../duel/pre_match_ready_screen.dart';",
          )
          replace_once(
              root,
              "    _push.openedChallengeId.addListener(_schedulePushRouting);\n    _push.openedRematchId.addListener(_schedulePushRouting);",
              "    _push.openedChallengeId.addListener(_schedulePushRouting);\n    _push.openedRematchId.addListener(_schedulePushRouting);\n    _push.openedRoomId.addListener(_schedulePushRouting);",
          )
          replace_once(
              root,
              "    _push.openedChallengeId.removeListener(_schedulePushRouting);\n    _push.openedRematchId.removeListener(_schedulePushRouting);",
              "    _push.openedChallengeId.removeListener(_schedulePushRouting);\n    _push.openedRematchId.removeListener(_schedulePushRouting);\n    _push.openedRoomId.removeListener(_schedulePushRouting);",
          )
          replace_once(
              root,
              """    final challengeId = _push.openedChallengeId.value;
    final rematchId = _push.openedRematchId.value;
    if ((challengeId == null || challengeId.isEmpty) &&
        (rematchId == null || rematchId.isEmpty)) {
      return;
    }
""",
              """    final roomId = _push.openedRoomId.value;
    final challengeId = _push.openedChallengeId.value;
    final rematchId = _push.openedRematchId.value;
    if ((roomId == null || roomId.isEmpty) &&
        (challengeId == null || challengeId.isEmpty) &&
        (rematchId == null || rematchId.isEmpty)) {
      return;
    }
""",
          )
          replace_once(
              root,
              """      if (challengeId != null && challengeId.isNotEmpty) {
        _push.openedChallengeId.value = null;
        await Navigator.of(context).push<void>(
          MaterialPageRoute(
            builder: (_) => UxChallengeInvitationScreen(
              challengeId: challengeId,
            ),
          ),
        );
      } else if (rematchId != null && rematchId.isNotEmpty) {
""",
              """      if (roomId != null && roomId.isNotEmpty) {
        _push.openedRoomId.value = null;
        await Navigator.of(context).push<void>(
          MaterialPageRoute(
            builder: (_) => PreMatchReadyScreen(roomId: roomId),
          ),
        );
      } else if (challengeId != null && challengeId.isNotEmpty) {
        _push.openedChallengeId.value = null;
        await Navigator.of(context).push<void>(
          MaterialPageRoute(
            builder: (_) => UxChallengeInvitationScreen(
              challengeId: challengeId,
            ),
          ),
        );
      } else if (rematchId != null && rematchId.isNotEmpty) {
""",
          )
          replace_once(
              root,
              """        if (_push.openedChallengeId.value != null ||
            _push.openedRematchId.value != null) {
          _schedulePushRouting();
        }
""",
              """        if (_push.hasPendingNavigation) {
          _schedulePushRouting();
        }
""",
          )
          replace_once(
              root,
              """    await _refreshAfterRoute();
  }

  Future<void> _refreshAfterRoute() async {
""",
              """    await _refreshAfterRoute();
    if (_push.hasPendingNavigation) _schedulePushRouting();
  }

  Future<void> _refreshAfterRoute() async {
""",
          )

          invitation = Path('lib/features/social/ux_challenge_invitation_screen.dart')
          replace_once(
              invitation,
              "import '../duel/online_duel_screen.dart';",
              "import '../duel/pre_match_ready_screen.dart';",
          )
          replace_once(
              invitation,
              """      final roomId = result.roomId;
      if (roomId == null || roomId.isEmpty) {
        setState(() => _error = context.tr('matchmaking_start_failed'));
        return;
      }
      await _economy.refresh(showLoading: false);
      if (!mounted) return;
      await Navigator.of(context).pushReplacement<void, void>(
        MaterialPageRoute(builder: (_) => OnlineDuelScreen(roomId: roomId)),
      );
""",
              """      final roomId = await _resolveRoomId(result);
      if (!mounted) return;
      if (roomId == null || roomId.isEmpty) {
        setState(() => _error = context.tr('matchmaking_start_failed'));
        return;
      }
      await _economy.refresh(showLoading: false);
      if (!mounted) return;
      await Navigator.of(context).pushReplacement<void, void>(
        MaterialPageRoute(
          builder: (_) => PreMatchReadyScreen(roomId: roomId),
        ),
      );
""",
          )
          replace_once(
              invitation,
              """  Future<void> _openStore() async {
""",
              """  Future<String?> _resolveRoomId(SocialChallenge result) async {
    final directRoomId = result.roomId?.trim();
    if (directRoomId != null && directRoomId.isNotEmpty) {
      return directRoomId;
    }
    for (var attempt = 0; attempt < 5; attempt++) {
      await Future<void>.delayed(const Duration(milliseconds: 400));
      final active = await _social.activeMatch();
      final roomId = active?['roomId']?.toString().trim();
      if (roomId != null && roomId.isNotEmpty) return roomId;
    }
    return null;
  }

  Future<void> _openStore() async {
""",
          )

          social = Path('lib/features/social/social_hub_screen.dart')
          replace_once(
              social,
              "import '../../services/player_profile_service.dart';\nimport '../../services/social_api_client.dart';",
              "import '../../services/player_profile_service.dart';\nimport '../../services/push_notification_service.dart';\nimport '../../services/social_api_client.dart';",
          )
          replace_once(
              social,
              "import 'ux_challenge_invitation_screen.dart';",
              "import 'challenge_waiting_screen.dart';\nimport 'ux_challenge_invitation_screen.dart';",
          )
          replace_once(
              social,
              "  final SocialApiClient _social = SocialApiClient.instance;\n  final TextEditingController _search = TextEditingController();",
              "  final SocialApiClient _social = SocialApiClient.instance;\n  final PushNotificationService _push = PushNotificationService.instance;\n  final TextEditingController _search = TextEditingController();",
          )
          replace_once(
              social,
              "  bool _loading = true;\n  bool _searching = false;",
              "  bool _loading = true;\n  bool _searching = false;\n  bool _pushBusy = false;",
          )
          replace_once(
              social,
              "    _tabs = TabController(length: 4, vsync: this);\n    unawaited(_load());",
              "    _tabs = TabController(length: 4, vsync: this);\n    unawaited(_load());\n    unawaited(_prepareNotifications());",
          )
          replace_once(
              social,
              """  Future<void> _findPlayers() async {
""",
              """  Future<void> _prepareNotifications() async {
    await _push.initialize();
    if (!_push.userDisabled.value) {
      await _push.refreshRegistration();
    }
    if (mounted) setState(() {});
  }

  Future<bool> _enableNotifications() async {
    if (_pushBusy) return _push.enabled.value;
    setState(() => _pushBusy = true);
    try {
      final enabled = await _push.requestPermissionAndRegister();
      if (!mounted) return enabled;
      if (!enabled) {
        _showSnack(
          _push.lastRegistrationError.value ??
              context.tr('challenge_notification_permission_denied'),
        );
      }
      return enabled;
    } finally {
      if (mounted) setState(() => _pushBusy = false);
    }
  }

  Future<void> _findPlayers() async {
""",
          )
          text = social.read_text(encoding='utf-8')
          pattern = re.compile(
              r"  Future<void> _challenge\(SocialPlayer player\) async \{.*?\n  \}\n\n  Future<void> _openChallenge",
              re.S,
          )
          replacement = """  Future<void> _challenge(SocialPlayer player) async {
    final difficulty = await showAdaptiveBottomSheet<SudokuDifficulty>(
      context: context,
      builder: (sheetContext) => Padding(
        padding: const EdgeInsets.fromLTRB(16, 4, 16, 20),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          crossAxisAlignment: CrossAxisAlignment.stretch,
          children: [
            Text(
              context.tr('choose_duel_difficulty'),
              textAlign: TextAlign.center,
              style: Theme.of(sheetContext).textTheme.titleLarge?.copyWith(
                    fontWeight: FontWeight.w900,
                  ),
            ),
            const SizedBox(height: 10),
            for (final item in SudokuDifficulty.values)
              ListTile(
                minTileHeight: 52,
                leading: const Icon(Icons.grid_4x4_rounded),
                title: Text(context.strings.difficultyLabel(item)),
                trailing: const Icon(Icons.chevron_right_rounded),
                onTap: () => Navigator.of(sheetContext).pop(item),
              ),
          ],
        ),
      ),
    );
    if (difficulty == null || _busyId != null) return;

    if (!_push.enabled.value && !_push.userDisabled.value) {
      await _enableNotifications();
      if (!mounted) return;
    }

    setState(() {
      _busyId = 'challenge-${player.publicId}';
      _error = null;
    });
    try {
      final challenge = await _social.createChallenge(
        recipientPublicId: player.publicId,
        difficulty: difficulty.name,
      );
      if (!mounted) return;
      await Navigator.of(context).push<void>(
        MaterialPageRoute(
          builder: (_) => ChallengeWaitingScreen(challenge: challenge),
        ),
      );
      if (mounted) await _load();
    } catch (error) {
      if (mounted) setState(() => _error = error.toString());
    } finally {
      if (mounted) setState(() => _busyId = null);
    }
  }

  Future<void> _openChallenge"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('Unable to replace SocialHub challenge flow')
          social.write_text(text, encoding='utf-8')
          replace_once(
              social,
              """                    child: Column(
                      children: [
                        TextField(
""",
              """                    child: Column(
                      children: [
                        ValueListenableBuilder<bool>(
                          valueListenable: _push.enabled,
                          builder: (context, enabled, _) {
                            if (!_push.configured || enabled) {
                              return const SizedBox.shrink();
                            }
                            return Padding(
                              padding: const EdgeInsets.only(bottom: 10),
                              child: _NotificationActivationCard(
                                busy: _pushBusy,
                                error: _push.lastRegistrationError.value,
                                onEnable: _enableNotifications,
                              ),
                            );
                          },
                        ),
                        TextField(
""",
          )
          replace_once(
              social,
              """class _PlayerRow extends StatelessWidget {
""",
              """class _NotificationActivationCard extends StatelessWidget {
  const _NotificationActivationCard({
    required this.busy,
    required this.error,
    required this.onEnable,
  });

  final bool busy;
  final String? error;
  final Future<bool> Function() onEnable;

  @override
  Widget build(BuildContext context) {
    const accent = Color(0xFF3AA9FF);
    return Container(
      width: double.infinity,
      padding: const EdgeInsets.all(14),
      decoration: BoxDecoration(
        color: const Color(0xFF101B20).withValues(alpha: .97),
        borderRadius: BorderRadius.circular(18),
        border: Border.all(color: accent.withValues(alpha: .38)),
      ),
      child: LayoutBuilder(
        builder: (context, constraints) {
          final compact =
              constraints.maxWidth < 440 ||
              MediaQuery.textScalerOf(context).scale(1) > 1.3;
          final message = Row(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Container(
                width: 44,
                height: 44,
                decoration: BoxDecoration(
                  color: accent.withValues(alpha: .13),
                  borderRadius: BorderRadius.circular(14),
                ),
                child: const Icon(
                  Icons.notifications_active_outlined,
                  color: accent,
                ),
              ),
              const SizedBox(width: 11),
              Expanded(
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.start,
                  children: [
                    Text(
                      context.tr('online_challenge_notifications'),
                      style: const TextStyle(
                        color: Colors.white,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    const SizedBox(height: 3),
                    Text(
                      error ??
                          context.tr(
                            'online_challenge_notifications_subtitle',
                          ),
                      style: TextStyle(
                        color: Colors.white.withValues(alpha: .64),
                      ),
                    ),
                  ],
                ),
              ),
            ],
          );
          final button = FilledButton.icon(
            onPressed: busy ? null : () => onEnable(),
            icon: busy
                ? const SizedBox.square(
                    dimension: 17,
                    child: CircularProgressIndicator(strokeWidth: 2),
                  )
                : const Icon(Icons.notifications_rounded),
            label: Text(context.tr('continue_action')),
          );
          if (compact) {
            return Column(
              crossAxisAlignment: CrossAxisAlignment.stretch,
              children: [
                message,
                const SizedBox(height: 10),
                button,
              ],
            );
          }
          return Row(
            children: [
              Expanded(child: message),
              const SizedBox(width: 12),
              button,
            ],
          );
        },
      ),
    );
  }
}

