name: Flutter checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a ci.log
      - name: Format sources
        run: |
          set -o pipefail
          dart format lib test 2>&1 | tee -a ci.log
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a ci.log
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log
      - name: Upload CI log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-log
          path: ci.log
