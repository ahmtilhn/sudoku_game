name: Unify online duel result template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-online-result-main.yml'

permissions:
  contents: write

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 3

      - name: Center and polish result presentation
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()

          source = source.replace(
              '        barrierColor: Colors.black.withValues(alpha: .68),',
              '        barrierColor: Colors.black.withValues(alpha: .78),',
              1,
          )
          source = source.replace(
              '                    height: availableHeight.clamp(0.0, 820.0).toDouble(),',
              '                    height: availableHeight.clamp(0.0, 800.0).toDouble(),',
              1,
          )

          old_start = chr(10).join([
              '    return SingleChildScrollView(',
              '      padding: EdgeInsets.fromLTRB(',
              '        8,',
              '        6,',
              '        8,',
              '        10 + MediaQuery.viewInsetsOf(context).bottom,',
              '      ),',
              '      child: _ResultCard(',
          ])
          new_start = chr(10).join([
              '    return LayoutBuilder(',
              '      builder: (context, constraints) {',
              '        final bottomInset = MediaQuery.viewInsetsOf(context).bottom;',
              '        const horizontalPadding = 8.0;',
              '        const topPadding = 6.0;',
              '        final bottomPadding = 10.0 + bottomInset;',
              '        final minContentHeight =',
              '            (constraints.maxHeight - topPadding - bottomPadding)',
              '                .clamp(0.0, double.infinity)',
              '                .toDouble();',
              '        return SingleChildScrollView(',
              '          padding: EdgeInsets.fromLTRB(',
              '            horizontalPadding,',
              '            topPadding,',
              '            horizontalPadding,',
              '            bottomPadding,',
              '          ),',
              '          child: ConstrainedBox(',
              '            constraints: BoxConstraints(minHeight: minContentHeight),',
              '            child: Center(',
              '              child: _ResultCard(',
          ])
          if old_start not in source:
              raise SystemExit('result scroll start not found')
          source = source.replace(old_start, new_start, 1)

          old_end = chr(10).join([
              '        onStore: () => Navigator.of(context).push<void>(',
              '          MaterialPageRoute(builder: (_) => const CoinStoreScreen()),',
              '        ),',
              '      ),',
              '    );',
              '  }',
              '',
          ])
          new_end = chr(10).join([
              '        onStore: () => Navigator.of(context).push<void>(',
              '          MaterialPageRoute(builder: (_) => const CoinStoreScreen()),',
              '        ),',
              '              ),',
              '            ),',
              '          ),',
              '        );',
              '      },',
              '    );',
              '  }',
              '',
          ])
          if old_end not in source:
              raise SystemExit('result scroll end not found')
          source = source.replace(old_end, new_end, 1)

          source = source.replace(
              '        borderRadius: BorderRadius.circular(compact ? 18 : 20),',
              '        borderRadius: BorderRadius.circular(compact ? 15 : 17),',
              1,
          )
          source = source.replace(
              '          color: const Color(0xFF5C8FB8).withValues(alpha: .28),',
              '          color: const Color(0xFF5C8FB8).withValues(alpha: .20),',
              1,
          )
          source = source.replace('            blurRadius: 22,', '            blurRadius: 18,', 1)
          source = source.replace('            width: compact ? 50 : 58,', '            width: compact ? 58 : 66,', 1)
          source = source.replace('            height: compact ? 50 : 58,', '            height: compact ? 58 : 66,', 1)
          source = source.replace('              fontSize: compact ? 22 : 26,', '              fontSize: compact ? 24 : 28,', 1)
          path.write_text(source)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Verify centered result contract
        shell: python
        run: |
          from pathlib import Path
          source = Path('lib/features/duel/online_duel_screen.dart').read_text()
          assert 'constraints: BoxConstraints(minHeight: minContentHeight)' in source
          assert 'barrierColor: Colors.black.withValues(alpha: .78)' in source
          assert "assets/ELO_rating_icons/cup.png" in source

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD~2 -- .github/workflows/unify-online-result-main.yml
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart .github/workflows/unify-online-result-main.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Center and refine duel result popup [skip ci]'
          git push origin HEAD:main
