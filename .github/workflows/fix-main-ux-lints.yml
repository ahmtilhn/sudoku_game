name: Apply shared online duel outcome template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-ux-lints.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-online-outcome-main
  cancel-in-progress: false

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace independent online result chrome
        shell: python
        env:
          RESULT_CARD_B64: 
        run: |
          import base64
          import os
          from pathlib import Path

          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()
          import_anchor = "import '../../widgets/sudoku_board.dart';\n"
          import_line = "import '../../widgets/ux_feedback.dart';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('Sudoku board import anchor not found.')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          class_start = source.index('class _ResultShowcaseCard extends StatelessWidget {')
          players_start = source.index('class _ResultPlayersRow', class_start)
          replacement = base64.b64decode(os.environ['RESULT_CARD_B64']).decode()
          source = source[:class_start] + replacement + source[players_start:]
          path.write_text(source)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: python3 tool/verify_ux_contracts.py
      - run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify online duel result with the shared outcome template'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
