name: Remove retired result reward ad UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/economy-v3-remove-legacy-result-ad.yml'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove retired generic Career ad from result sheet
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/game/enhanced_game_screen.dart')
          source = path.read_text()
          old_state = "  bool _rewardBusy = false;\n  bool _rewardClaimed = false;\n  String? _message;\n  late int _earnedCoins;\n"
          if old_state in source:
              source = source.replace(old_state, "  late int _earnedCoins;\n", 1)
          method_start = "  Future<void> _claimReward() async {\n"
          method_end = "  @override\n  Widget build(BuildContext context) {\n"
          if method_start in source:
              start = source.index(method_start)
              end = source.index(method_end, start)
              source = source[:start] + source[end:]
          ui_start = "            if (!AdsService.instance.noAds && !_rewardClaimed) ...[\n"
          ui_end = "            const SizedBox(height: 18),\n"
          if ui_start in source:
              start = source.index(ui_start)
              end = source.index(ui_end, start)
              source = source[:start] + source[end:]
          if 'claimCareerRewardedInterstitialCoins' in source:
              raise SystemExit('retired result reward call still present')
          if 'watch_and_earn_coin' in source:
              raise SystemExit('retired result reward CTA still present')
          path.write_text(source)
      - run: git diff --check
      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/game/enhanced_game_screen.dart
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'economy: remove retired generic result reward ad'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
