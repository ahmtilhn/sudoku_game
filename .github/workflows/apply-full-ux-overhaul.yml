name: Apply full UX overhaul

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-full-ux-overhaul.yml"
      - "tool/ux_patch_parts/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-full-ux-overhaul
  cancel-in-progress: false

jobs:
  apply-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat tool/ux_patch_parts/* | base64 --decode | gzip --decompress > /tmp/full-ux.patch
          echo "c68936613438f74896b515413ce9433a9dfe1f53c89f2000c8a37e918e5d101e  /tmp/full-ux.patch" | sha256sum --check
          git apply --check /tmp/full-ux.patch
          git apply --index /tmp/full-ux.patch

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Format source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          python3 - <<'PY'
          from pathlib import Path

          audit_path = Path("docs/FULL_UX_AUDIT_2026-08.md")
          if audit_path.exists():
              lines = audit_path.read_text(encoding="utf-8").splitlines()
              audit_path.write_text(
                  "\n".join(line.rstrip() for line in lines) + "\n",
                  encoding="utf-8",
              )
          PY
          git add -A
          git diff --check --cached

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --concurrency=1 --timeout=180s

      - name: Verify Google Play Billing dependency
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew app:dependencies --configuration releaseRuntimeClasspath > /tmp/release-runtime-dependencies.txt
          grep -E "com\.android\.billingclient:billing(-ktx)?(:| )" /tmp/release-runtime-dependencies.txt

      - name: Verify release configuration
        shell: pwsh
        run: ./tool/verify_android_release_config.ps1

      - name: Create ephemeral CI upload key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Sudoku Duel CI, OU=CI, O=Devovia, L=CI, ST=CI, C=NL"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Inspect release app bundle
        shell: pwsh
        run: |
          ./tool/verify_online_aab.ps1 `
            -Path "./build/app/outputs/bundle/release/app-release.aab"

      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-duel-0.1.9-22-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Finalize directly on main
        shell: bash
        run: |
          set -euo pipefail
          rm -f android/key.properties android/ci-upload.jks
          git rm -r tool/ux_patch_parts .github/workflows/apply-full-ux-overhaul.yml
          git add -A
          git diff --check --cached
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete gameplay profile and UX overhaul"
          git push origin HEAD:main
