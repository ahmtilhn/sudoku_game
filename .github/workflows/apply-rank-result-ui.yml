name: Apply RP result UI integration

on:
  push:
    branches: [main]
    paths:
      - 'tool/rank_result_patch/**'
      - '.github/workflows/apply-rank-result-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rank-result-ui
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reconstruct and verify targeted patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode tool/rank_result_patch/online_result.patch.gz.b64 \
            | gzip --decompress > /tmp/rank-result.patch
          echo '683d751b4aad95bec3cf6674b4740777875142d50bd3d9b298cc669498bb3dd5  /tmp/rank-result.patch' \
            | sha256sum --check
          git apply --check /tmp/rank-result.patch
          git apply /tmp/rank-result.patch
          git diff --check

      - name: Validate backend rank layer
        working-directory: backend/social_worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Format targeted UI
        run: dart format lib/features/duel/online_duel_screen.dart

      - name: Validate localization and UX contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tool/validate_localizations.py
          python3 tool/verify_user_facing_messages.py
          python3 tool/verify_ux_contracts.py

      - name: Analyze Flutter app
        run: flutter analyze --fatal-infos

      - name: Run Flutter tests
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit validated RP result UI directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/duel/online_duel_screen.dart
          if git diff --cached --quiet; then
            echo 'RP result UI is already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show RP instead of hidden MMR after ranked matches'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
