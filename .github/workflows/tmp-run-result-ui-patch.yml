name: Temporary run result UI patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-run-result-ui-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - run: python3 tool/tmp_patch_result_ui.py
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Polish responsive duel win and loss popups'
          git push origin HEAD:main
