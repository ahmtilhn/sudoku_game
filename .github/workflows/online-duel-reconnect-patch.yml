name: Temporary Online Duel Reconnect Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/online-duel-reconnect-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reconnect payout and header patch
        run: python3 .github/scripts/apply_online_duel_reconnect_patch.py

      - name: Verify backend duel engine
        working-directory: backend/social_worker
        run: |
          npm ci
          npm run typecheck
          npm test -- test/online_duel.test.ts test/economy.test.ts test/economy_payout_contract.test.ts

      - name: Commit patch directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/social_worker/src/online_duel_model.ts backend/social_worker/src/online_duel_engine.ts backend/social_worker/src/online_duel_view.ts backend/social_worker/test/online_duel.test.ts backend/social_worker/test/economy_payout_contract.test.ts lib/services/online_duel_models.dart lib/services/online_duel_controller.dart lib/features/duel/online_duel_screen.dart lib/features/duel/duel_payout_display.dart test/online_duel_screen_test.dart test/duel_payout_display_test.dart
          git commit -m "fix(duel): pause reconnects and clarify pot payouts"
          git push origin HEAD:main
