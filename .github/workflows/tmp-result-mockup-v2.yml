name: Temporary result mockup v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-result-mockup-v2.yml'

permissions:
  contents: write

concurrency:
  group: tmp-result-mockup-v2-main
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply result mockup patch
        run: python3 tool/tmp_result_mockup_v2.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Commit UI only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No result UI changes required.'
            exit 0
          fi
          git commit -m 'Rebuild duel result popup from approved mockup'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# trigger: result-mockup-v2
