name: Apply Samurai Integration

on:
  push:
    branches: [feature/samurai-sudoku]
    paths:
      - 'tool/apply_samurai_integration.py'
      - '.github/workflows/apply-samurai-integration.yml'

permissions:
  contents: write

concurrency:
  group: apply-samurai-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/samurai-sudoku
          fetch-depth: 0
      - name: Apply integration
        run: python3 tool/apply_samurai_integration.py
      - name: Validate localization sources
        run: python3 tool/validate_localizations.py
      - name: Refresh UX audit
        run: python3 tool/generate_ux_audit.py --write
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/career/career_hub_screen.dart \
            lib/localization/app_strings.dart \
            android/app/src/main/res/values/strings.xml \
            assets/localization/Localizable.xcstrings \
            docs/ux_audit.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'feat(samurai): integrate practice entry and localization'
          git push origin HEAD:feature/samurai-sudoku
