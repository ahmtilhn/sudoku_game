name: Apply Samurai Polish

on:
  push:
    branches: [feature/samurai-sudoku]
    paths:
      - 'tool/apply_samurai_polish.py'
      - '.github/workflows/apply-samurai-polish.yml'

permissions:
  contents: write

concurrency:
  group: apply-samurai-polish
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/samurai-sudoku
          fetch-depth: 0
      - name: Apply final polish
        run: python3 tool/apply_samurai_polish.py
      - name: Refresh UX audit
        run: python3 tool/generate_ux_audit.py --write
      - name: Commit generated integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/widgets/samurai_board.dart \
            lib/features/game/samurai_game_screen.dart \
            lib/features/game/enhanced_game_screen.dart \
            docs/ux_audit.md
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'fix(samurai): fit mobile board and own active session'
          git push origin HEAD:feature/samurai-sudoku
