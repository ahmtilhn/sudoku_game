name: Unify online duel result template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-online-result-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unify-online-result-main
  cancel-in-progress: false

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Replace independent online result chrome
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()
          import_anchor = "import '../../widgets/sudoku_board.dart';\n"
          import_line = "import '../../widgets/ux_feedback.dart';\n"
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('Sudoku board import anchor not found.')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          class_start = source.index('class _ResultShowcaseCard extends StatelessWidget {')
          painter_start = source.index('class _ResultSurfacePainter', class_start)
          players_start = source.index('class _ResultPlayersRow', painter_start)

          replacement = r'''class _ResultShowcaseCard extends StatelessWidget {
  const _ResultShowcaseCard({
    required this.title,
    required this.subtitle,
    required this.won,
    required this.draw,
    required this.localPlayer,
    required this.opponent,
    required this.localScore,
    required this.opponentScore,
    required this.localRating,
    required this.opponentRating,
    required this.rating,
    required this.rows,
    required this.footer,
  });

  final String title;
  final String subtitle;
  final bool won;
  final bool draw;
  final OnlineDuelPlayer localPlayer;
  final OnlineDuelPlayer opponent;
  final int localScore;
  final int opponentScore;
  final int localRating;
  final int opponentRating;
  final OnlineDuelRatingChange? rating;
  final List<_ResultMetric> rows;
  final Widget footer;

  @override
  Widget build(BuildContext context) {
    final accent = draw
        ? const Color(0xFF8DA2BE)
        : won
            ? const Color(0xFF29D398)
            : Theme.of(context).colorScheme.error;
    final icon = draw
        ? Icons.handshake_outlined
        : won
            ? Icons.emoji_events_rounded
            : Icons.flag_rounded;

    return Card(
      clipBehavior: Clip.antiAlias,
      child: Padding(
        padding: const EdgeInsets.fromLTRB(16, 20, 16, 16),
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            UxOutcomeHeader(
              icon: icon,
              title: title,
              subtitle: subtitle,
              accent: accent,
            ),
            const SizedBox(height: 18),
            _ResultPlayersRow(
              localPlayer: localPlayer,
              opponent: opponent,
              localScore: localScore,
              opponentScore: opponentScore,
              localRating: localRating,
              opponentRating: opponentRating,
              accent: accent,
            ),
            const SizedBox(height: 12),
            DecoratedBox(
              decoration: BoxDecoration(
                color: Theme.of(context).colorScheme.surfaceContainerHigh,
                borderRadius: BorderRadius.circular(16),
                border: Border.all(
                  color: Theme.of(context).colorScheme.outlineVariant,
                ),
              ),
              child: Padding(
                padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 8),
                child: Column(
                  children: [for (final row in rows) _ResultCompareRow(row: row)],
                ),
              ),
            ),
            if (rating != null) ...[
              const SizedBox(height: 12),
              _ResultEloBar(rating: rating!, color: accent),
            ],
            const SizedBox(height: 4),
            footer,
          ],
        ),
      ),
    );
  }
}

'''
          source = source[:class_start] + replacement + source[players_start:]
          path.write_text(source)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: python3 tool/verify_ux_contracts.py
      - run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify online duel result with the shared outcome template'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
