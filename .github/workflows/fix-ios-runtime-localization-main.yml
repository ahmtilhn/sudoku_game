name: Fix iOS runtime localization on main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-runtime-localization-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-ios-runtime-localization-main
  cancel-in-progress: false

jobs:
  fix-test-and-commit:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter packages
        run: flutter pub get

      - name: Harden iOS locale resolution
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          app_path = Path('lib/localization/app_strings.dart')
          app = app_path.read_text(encoding='utf-8')

          replacement = r'''  static Future<AppStrings> load() async {
            final values = Map<String, String>.from(english);
            final catalogLocales = defaultTargetPlatform == TargetPlatform.iOS
                ? await _preferredIosLocales()
                : const <Locale>[Locale('en')];
            await _loadStringCatalog(values, catalogLocales);

            // Android intentionally keeps the native resource override so Google Play's
            // server-generated app-string translations can replace the English source.
            // iOS uses the bundled String Catalog directly; reading NSLocalizedString
            // here would introduce a second, independent localization source.
            if (defaultTargetPlatform == TargetPlatform.android) {
              try {
                final response = await _channel.invokeMethod<Map<Object?, Object?>>(
                  'getStrings',
                  <String, Object>{'keys': english.keys.toList(growable: false)},
                );
                if (response != null) {
                  for (final entry in response.entries) {
                    final key = entry.key;
                    final value = entry.value;
                    if (key is String &&
                        value is String &&
                        value.isNotEmpty &&
                        value != key) {
                      values[key] = value;
                    }
                  }
                }
              } on MissingPluginException {
                // Unit tests and unsupported platforms use the catalog or English fallback.
              } on PlatformException {
                // A platform localization failure must never block app startup.
              }
            }
            return AppStrings._(values);
          }

          static Future<List<Locale>> _preferredIosLocales() async {
            final flutterLocales = PlatformDispatcher.instance.locales;
            try {
              final preferredLanguages = await _channel.invokeListMethod<String>(
                'getPreferredLocales',
              );
              if (preferredLanguages != null && preferredLanguages.isNotEmpty) {
                final nativeLocales = preferredLanguages
                    .map(_localeFromLanguageTag)
                    .whereType<Locale>()
                    .toList(growable: false);
                if (nativeLocales.isNotEmpty) {
                  return <Locale>[...nativeLocales, ...flutterLocales];
                }
              }
            } on MissingPluginException {
              // Flutter's locale list remains the source of truth if the bridge is absent.
            } on PlatformException {
              // Fall back to Flutter's locale list if native locale lookup fails.
            }
            return flutterLocales.isNotEmpty
                ? flutterLocales
                : const <Locale>[Locale('en')];
          }

          static Locale? _localeFromLanguageTag(String rawTag) {
            final tag = rawTag.trim().replaceAll('_', '-');
            if (tag.isEmpty) return null;
            final parts = tag
                .split('-')
                .where((part) => part.isNotEmpty)
                .toList(growable: false);
            if (parts.isEmpty) return null;

            final language = parts.first.toLowerCase();
            String? script;
            String? country;
            for (final part in parts.skip(1)) {
              if (part.length == 4 && script == null) {
                script = '${part[0].toUpperCase()}${part.substring(1).toLowerCase()}';
              } else if ((part.length == 2 || part.length == 3) && country == null) {
                country = part.toUpperCase();
              }
            }
            return Locale.fromSubtags(
              languageCode: language,
              scriptCode: script,
              countryCode: country,
            );
          }

          static Future<void> _loadStringCatalog('''

          pattern = re.compile(
              r"  static Future<AppStrings> load\(\) async \{.*?\n  static Future<void> _loadStringCatalog\(",
              re.S,
          )
          updated, count = pattern.subn(replacement, app, count=1)
          if count != 1:
              raise SystemExit('Could not locate the AppStrings.load localization block exactly once.')
          app_path.write_text(updated, encoding='utf-8')

          swift_path = Path('ios/Runner/AppDelegate.swift')
          swift = swift_path.read_text(encoding='utf-8')
          swift_replacement = r'''  private func configureLocalizationChannel(messenger: FlutterBinaryMessenger) {
            let channel = FlutterMethodChannel(
              name: "com.devovia.sudoku/localization",
              binaryMessenger: messenger
            )
            channel.setMethodCallHandler { call, result in
              switch call.method {
              case "getPreferredLocales":
                result(Locale.preferredLanguages)
              case "getStrings":
                // iOS strings come from the Flutter-bundled String Catalog. Android
                // alone uses native resources for Google Play app-string translation.
                result([String: String]())
              default:
                result(FlutterMethodNotImplemented)
              }
            }
            localizationChannel = channel
          }

          private func configureGameServicesChannel'''
          swift_pattern = re.compile(
              r"  private func configureLocalizationChannel\(messenger: FlutterBinaryMessenger\) \{.*?\n  private func configureGameServicesChannel",
              re.S,
          )
          swift_updated, swift_count = swift_pattern.subn(swift_replacement, swift, count=1)
          if swift_count != 1:
              raise SystemExit('Could not locate the iOS localization channel exactly once.')
          swift_path.write_text(swift_updated, encoding='utf-8')
          PY

          dart format lib/localization/app_strings.dart

      - name: Install English to Turkish translation model
        run: python3 -m pip install --disable-pip-version-check --quiet 'transformers<5' sentencepiece torch

      - name: Replace English-copy Turkish catalog entries
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          import torch
          from transformers import AutoModelForSeq2SeqLM, AutoTokenizer

          CATALOG = Path('assets/localization/Localizable.xcstrings')
          MODEL = 'Helsinki-NLP/opus-mt-tc-big-en-tr'
          PLACEHOLDER_RE = re.compile(r'%(?:\d+\$?)?[sd]|%%')
          catalog = json.loads(CATALOG.read_text(encoding='utf-8'))
          strings = catalog['strings']

          def unit(definition, locale):
              localizations = definition.setdefault('localizations', {})
              localization = localizations.setdefault(locale, {})
              return localization.setdefault('stringUnit', {'state': 'translated', 'value': ''})

          pending = []
          for key, definition in strings.items():
              en = unit(definition, 'en').get('value', '')
              tr = unit(definition, 'tr').get('value', '')
              if not isinstance(en, str) or not en.strip():
                  continue
              if not isinstance(tr, str) or not tr.strip() or tr == en:
                  pending.append((key, en))

          print(f'Turkish entries requiring translation: {len(pending)} / {len(strings)}')
          tokenizer = AutoTokenizer.from_pretrained(MODEL)
          model = AutoModelForSeq2SeqLM.from_pretrained(MODEL)
          device = torch.device('mps' if torch.backends.mps.is_available() else 'cpu')
          model.to(device)
          model.eval()

          protected = {}

          def protect(text):
              tokens = []
              def repl(match):
                  token = f'ZXPH{len(tokens)}ZX'
                  tokens.append((token, match.group(0)))
                  return token
              prepared = PLACEHOLDER_RE.sub(repl, text)
              prepared = prepared.replace('\n', ' ZXNEWLINEZX ')
              return prepared, tokens

          def restore(translated, tokens):
              result = translated.replace('ZXNEWLINEZX', '\n')
              for token, original in tokens:
                  # Marian may insert spaces around an unknown sentinel.
                  compact = re.sub(r'\s+', '', token)
                  found = False
                  variants = [token, token.lower(), token.upper()]
                  for variant in variants:
                      if variant in result:
                          result = result.replace(variant, original)
                          found = True
                  if not found:
                      normalized_result = re.sub(r'\s+', '', result)
                      if compact in normalized_result:
                          # This path is intentionally conservative; fail below if the
                          # original placeholder still cannot be recovered exactly.
                          result = normalized_result.replace(compact, original)
              return result.strip()

          batch_size = 24
          for start in range(0, len(pending), batch_size):
              batch = pending[start:start + batch_size]
              prepared = []
              metadata = []
              for key, source in batch:
                  text, tokens = protect(source)
                  prepared.append(text)
                  metadata.append((key, source, tokens))

              encoded = tokenizer(
                  prepared,
                  return_tensors='pt',
                  padding=True,
                  truncation=True,
                  max_length=256,
              ).to(device)
              with torch.inference_mode():
                  generated = model.generate(
                      **encoded,
                      max_new_tokens=256,
                      num_beams=4,
                      early_stopping=True,
                  )
              translations = tokenizer.batch_decode(generated, skip_special_tokens=True)

              for (key, source, tokens), translated in zip(metadata, translations):
                  translated = restore(translated, tokens)
                  source_placeholders = PLACEHOLDER_RE.findall(source)
                  translated_placeholders = PLACEHOLDER_RE.findall(translated)
                  if source_placeholders != translated_placeholders:
                      raise SystemExit(
                          f'Placeholder mismatch for {key}: {source_placeholders} -> '
                          f'{translated_placeholders}; translation={translated!r}'
                      )
                  if not translated:
                      raise SystemExit(f'Empty Turkish translation generated for {key}')
                  entry = unit(strings[key], 'tr')
                  entry['state'] = 'translated'
                  entry['value'] = translated

              print(f'Translated {min(start + batch_size, len(pending))}/{len(pending)}')

          CATALOG.write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Verify Turkish catalog quality and placeholders
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import re
          from pathlib import Path

          placeholder_re = re.compile(r'%(?:\d+\$?)?[sd]|%%')
          catalog = json.loads(Path('assets/localization/Localizable.xcstrings').read_text(encoding='utf-8'))
          strings = catalog['strings']
          identical = []
          for key, definition in strings.items():
              loc = definition.get('localizations', {})
              en = loc.get('en', {}).get('stringUnit', {}).get('value', '')
              tr = loc.get('tr', {}).get('stringUnit', {}).get('value', '')
              if not isinstance(tr, str) or not tr.strip():
                  raise SystemExit(f'Missing Turkish translation for {key}')
              if placeholder_re.findall(en) != placeholder_re.findall(tr):
                  raise SystemExit(f'Placeholder mismatch for {key}: {en!r} -> {tr!r}')
              if tr == en:
                  identical.append(key)

          for key in ('home', 'play', 'settings'):
              loc = strings[key]['localizations']
              en = loc['en']['stringUnit']['value']
              tr = loc['tr']['stringUnit']['value']
              print(f'{key}: en={en!r} tr={tr!r}')
              if tr == en:
                  raise SystemExit(f'{key} is still an English copy in Turkish: {tr!r}')

          print(f'Turkish catalog: {len(strings)} non-empty entries; {len(identical)} intentionally/possibly identical to English.')
          print('Sample identical keys:', ', '.join(identical[:40]))
          PY

      - name: Validate localization sources
        run: python3 tool/validate_localizations.py

      - name: Run locale consistency tests
        run: flutter test test/localization_locale_consistency_test.dart

      - name: Analyze locale runtime
        run: flutter analyze --fatal-infos lib/localization/app_strings.dart lib/app.dart

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Commit on top of latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add \
            lib/localization/app_strings.dart \
            ios/Runner/AppDelegate.swift \
            assets/localization/Localizable.xcstrings
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'iOS runtime localization is already fixed.'
            exit 0
          fi

          git commit -m "Fix Turkish iOS runtime localization"
          git pull --rebase origin main
          git push origin HEAD:main
