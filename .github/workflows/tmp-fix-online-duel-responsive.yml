name: Temporary online duel responsive layout fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-fix-online-duel-responsive.yml'

permissions:
  contents: write

concurrency:
  group: tmp-online-duel-responsive-main
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Patch active duel responsive constraints
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()

          arena_start = source.index('class _ArenaMatchLayout extends StatelessWidget {')
          arena_end = source.index('class _TurnStatusStrip extends StatelessWidget {', arena_start)
          arena = source[arena_start:arena_end]

          old_column = '''          child: Column(\n            children: ['''
          new_column = '''          child: Column(\n            crossAxisAlignment: CrossAxisAlignment.stretch,\n            children: ['''
          if old_column not in arena:
              raise SystemExit('Arena Column anchor not found')
          arena = arena.replace(old_column, new_column, 1)

          old_board = '''                    final boardSize = mathMin(\n                      constraints.maxWidth,\n                      constraints.maxHeight,\n                    ).clamp(290.0, 720.0).toDouble();'''
          new_board = '''                    final boardSize = mathMin(\n                      constraints.maxWidth,\n                      constraints.maxHeight,\n                    ).clamp(0.0, 720.0).toDouble();'''
          if old_board not in arena:
              raise SystemExit('Active board size anchor not found')
          arena = arena.replace(old_board, new_board, 1)
          source = source[:arena_start] + arena + source[arena_end:]

          header_start = source.index('class _MatchHeader extends StatelessWidget {')
          header_end = source.index('class _HeaderPlayer extends StatelessWidget {', header_start)
          header = source[header_start:header_end]
          old_header = '''    return SizedBox(\n      height: height,'''
          new_header = '''    return SizedBox(\n      width: double.infinity,\n      height: height,'''
          if old_header not in header:
              raise SystemExit('Match header width anchor not found')
          header = header.replace(old_header, new_header, 1)
          source = source[:header_start] + header + source[header_end:]

          path.write_text(source)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart lib/widgets/number_pad.dart

      - name: Commit fix directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No changes required.'
            exit 0
          fi
          git commit -m 'Fix online duel responsive header overflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
