name: Unify online duel result template

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unify-online-result-main.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unify-online-result-main
  cancel-in-progress: false

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Polish result proportions
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()

          def replace_once(old, new):
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match, got {count}: {old[:80]!r}')
              source = source.replace(old, new, 1)

          replace_once(
              '                  constraints: const BoxConstraints(maxWidth: 460),',
              '                  constraints: const BoxConstraints(maxWidth: 400),',
          )
          replace_once(
              '                    height: availableHeight.clamp(0.0, 900.0).toDouble(),',
              '                    height: availableHeight.clamp(0.0, 820.0).toDouble(),',
          )
          replace_once(
              '''      padding: EdgeInsets.fromLTRB(
        12,
        8,
        12,
        18 + MediaQuery.viewInsetsOf(context).bottom,
      ),''',
              '''      padding: EdgeInsets.fromLTRB(
        8,
        6,
        8,
        10 + MediaQuery.viewInsetsOf(context).bottom,
      ),''',
          )
          replace_once(
              '    final compact = viewport.width < 380 || viewport.height < 760;',
              '    final compact = viewport.width < 350 || viewport.height < 700;',
          )
          replace_once(
              '''    final compact =
        MediaQuery.sizeOf(context).width < 380 ||
        MediaQuery.sizeOf(context).height < 760;''',
              '''    final compact =
        MediaQuery.sizeOf(context).width < 350 ||
        MediaQuery.sizeOf(context).height < 700;''',
          )

          def edit_section(start_marker, end_marker, replacements):
              global source
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              section = source[start:end]
              for old, new in replacements:
                  if old not in section:
                      raise SystemExit(f'Missing in {start_marker}: {old[:80]!r}')
                  section = section.replace(old, new)
              source = source[:start] + section + source[end:]

          edit_section(
              'class _ResultCard extends StatelessWidget {',
              'class _ResultHero extends StatelessWidget {',
              [
                  ('compact ? 10 : 12,\n        compact ? 8 : 10,\n        compact ? 10 : 12,\n        compact ? 10 : 12,',
                   'compact ? 8 : 10,\n        compact ? 6 : 8,\n        compact ? 8 : 10,\n        compact ? 8 : 10,'),
                  ('BorderRadius.circular(compact ? 20 : 23)', 'BorderRadius.circular(compact ? 18 : 20)'),
                  ('.withValues(alpha: .36)', '.withValues(alpha: .28)'),
                  ('blurRadius: 28,', 'blurRadius: 22,'),
                  ('offset: const Offset(0, 15),', 'offset: const Offset(0, 10),'),
                  ('SizedBox(height: compact ? 7 : 9)', 'SizedBox(height: compact ? 5 : 6)'),
                  ('SizedBox(height: compact ? 8 : 10)', 'SizedBox(height: compact ? 6 : 8)'),
                  ('height: compact ? 42 : 46,', 'height: compact ? 38 : 42,'),
                  ('height: compact ? 40 : 44,', 'height: compact ? 36 : 40,'),
                  ('height: compact ? 38 : 42,', 'height: compact ? 34 : 38,'),
              ],
          )

          edit_section(
              'class _ResultHero extends StatelessWidget {',
              'class _ResultPlayers extends StatelessWidget {',
              [
                  ('width: compact ? 62 : 72,', 'width: compact ? 50 : 58,'),
                  ('height: compact ? 62 : 72,', 'height: compact ? 50 : 58,'),
                  ('fontSize: compact ? 25 : 29,', 'fontSize: compact ? 22 : 26,'),
                  ('fontSize: compact ? 10 : 11,', 'fontSize: compact ? 9.5 : 10.5,'),
              ],
          )

          edit_section(
              'class _ResultPlayers extends StatelessWidget {',
              'class _ResultPlayerPanel extends StatelessWidget {',
              [
                  ('height: compact ? 82 : 92,', 'height: compact ? 88 : 98,'),
                  ('SizedBox(width: compact ? 5 : 7)', 'SizedBox(width: compact ? 4 : 6)'),
                  ('width: compact ? 30 : 34,', 'width: compact ? 28 : 32,'),
                  ('height: compact ? 30 : 34,', 'height: compact ? 28 : 32,'),
              ],
          )

          edit_section(
              'class _ResultPlayerPanel extends StatelessWidget {',
              'class _ResultStatsTable extends StatelessWidget {',
              [
                  ('radius: compact ? 18 : 21,', 'radius: compact ? 20 : 23,'),
                  ('fontSize: compact ? 10 : 11,', 'fontSize: compact ? 10.5 : 11.5,'),
                  ('fontSize: compact ? 7.5 : 8.5,', 'fontSize: compact ? 8 : 9,'),
                  ('fontSize: compact ? 16 : 18,', 'fontSize: compact ? 17 : 19,'),
              ],
          )

          edit_section(
              'class _ResultStatsTable extends StatelessWidget {',
              'class _ResultRankPanel extends StatelessWidget {',
              [
                  ('vertical: compact ? 3 : 4,', 'vertical: compact ? 2 : 3,'),
                  ('height: compact ? 25 : 29,', 'height: compact ? 23 : 25,'),
              ],
          )

          path.write_text(source)

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Verify responsive result contract
        shell: python
        run: |
          from pathlib import Path
          source = Path('lib/features/duel/online_duel_screen.dart').read_text()
          assert 'BoxConstraints(maxWidth: 400)' in source
          assert 'availableHeight.clamp(0.0, 820.0)' in source
          assert 'viewport.width < 350 || viewport.height < 700' in source
          assert 'width: compact ? 50 : 58' in source
          assert 'height: compact ? 88 : 98' in source
          assert "assets/ELO_rating_icons/cup.png" in source

      - name: Restore workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout cf4f2ca503aa2a2047851defd93f15b281f42743 -- .github/workflows/unify-online-result-main.yml
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart .github/workflows/unify-online-result-main.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Polish responsive duel result layout [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
