name: Integrate current main into responsive branch

on:
  push:
    branches: [responsive-nonscroll-ui]
    paths:
      - '.github/workflows/integrate-current-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: responsive-nonscroll-ui
          fetch-depth: 0

      - name: Fetch latest main
        run: git fetch origin main

      - name: Preserve latest main inner responsive improvements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def git_show(path: str) -> str:
              return subprocess.check_output(
                  ['git', 'show', f'origin/main:{path}'], text=True
              )

          def replace_section(target: str, source: str, start: str, end: str) -> str:
              ts = target.index(start)
              te = target.index(end, ts)
              ss = source.index(start)
              se = source.index(end, ss)
              return target[:ts] + source[ss:se] + target[te:]

          home_path = Path('lib/features/home/professional_home_screen.dart')
          home = home_path.read_text()
          main_home = git_show(str(home_path))
          # Reward/result-adjacent UI was explicitly outside this task. Keep the
          # newest main implementation exactly while retaining our Home shell.
          home = replace_section(
              home,
              main_home,
              'class _DailyRewardDialog extends StatefulWidget',
              'class _HeaderButton extends StatelessWidget',
          )
          home_path.write_text(home)

          store_path = Path('lib/features/economy/coin_store_screen.dart')
          store = store_path.read_text()
          main_store = git_show(str(store_path))
          # Keep our no-scroll paginated store shell, but retain the newer
          # compact inner cards that landed on main while this branch existed.
          store = replace_section(
              store,
              main_store,
              'class _BalanceCard extends StatelessWidget',
              'String _coinArtForAmount',
          )
          store = replace_section(
              store,
              main_store,
              'class _CoinPackageCard extends StatelessWidget',
              'class _StoreChip extends StatelessWidget',
          )
          store_path.write_text(store)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Validate preserved responsive internals
        shell: bash
        run: |
          dart format lib/features/home/professional_home_screen.dart lib/features/economy/coin_store_screen.dart
          python3 tool/verify_non_scroll_layouts.py
          flutter analyze --no-fatal-infos
          flutter test test/widget_test.dart test/career_variant_progress_test.dart test/profile_hub_artwork_layout_test.dart --reporter expanded --concurrency=1

      - name: Commit preserved main UI internals
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/home/professional_home_screen.dart lib/features/economy/coin_store_screen.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve latest main responsive card improvements'
          fi
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true

      - name: Merge current main and resolve scoped layout overlaps
        shell: bash
        run: |
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            for path in \
              lib/features/home/professional_home_screen.dart \
              lib/features/economy/coin_store_screen.dart
            do
              if git ls-files -u -- "$path" | grep -q .; then
                # Our versions already contain main's excluded/inner UI updates
                # plus the validated non-scroll shell.
                git checkout --ours -- "$path"
                git add "$path"
              fi
            done
          fi

          unresolved=$(git diff --name-only --diff-filter=U)
          if [ -n "$unresolved" ]; then
            echo "Unexpected unresolved conflicts:"
            echo "$unresolved"
            exit 1
          fi

      - name: Validate merged branch
        shell: bash
        run: |
          flutter pub get
          dart format lib/features/home/professional_home_screen.dart lib/features/economy/coin_store_screen.dart
          python3 tool/verify_non_scroll_layouts.py
          flutter analyze --no-fatal-infos
          flutter test test/widget_test.dart test/career_variant_progress_test.dart test/profile_hub_artwork_layout_test.dart test/responsive_feedback_ux_test.dart --reporter expanded --concurrency=1
          git restore analysis_options.yaml pubspec.lock 2>/dev/null || true

      - name: Commit and push merged branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet || git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m 'Merge current main into responsive non-scroll UI'
          fi
          git push origin HEAD:responsive-nonscroll-ui
