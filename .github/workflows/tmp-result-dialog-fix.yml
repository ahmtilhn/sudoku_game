name: Temporary result dialog fix

# trigger: bounded dialog validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-result-dialog-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace result bottom sheet with bounded dialog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/duel/online_duel_screen.dart')
          source = path.read_text()
          old = '''      final action = await showModalBottomSheet<String>(
        context: context,
        isDismissible: false,
        enableDrag: false,
        isScrollControlled: true,
        useSafeArea: true,
        backgroundColor: Colors.transparent,
        barrierColor: Colors.black.withValues(alpha: .56),
        constraints: const BoxConstraints(maxWidth: 460),
        builder: (sheetContext) => FractionallySizedBox(
          heightFactor: MediaQuery.sizeOf(sheetContext).height < 720
              ? .98
              : .94,
          child: _OnlineResultSheet(snapshot: snapshot),
        ),
      );
'''
          new = '''      final action = await showGeneralDialog<String>(
        context: context,
        barrierDismissible: false,
        barrierLabel: 'Duel result',
        barrierColor: Colors.black.withValues(alpha: .68),
        transitionDuration: const Duration(milliseconds: 220),
        transitionBuilder: (dialogContext, animation, secondaryAnimation, child) {
          final curved = CurvedAnimation(
            parent: animation,
            curve: Curves.easeOutCubic,
            reverseCurve: Curves.easeInCubic,
          );
          return FadeTransition(
            opacity: curved,
            child: ScaleTransition(
              scale: Tween<double>(begin: .97, end: 1).animate(curved),
              child: child,
            ),
          );
        },
        pageBuilder: (dialogContext, animation, secondaryAnimation) {
          final media = MediaQuery.of(dialogContext);
          final availableHeight =
              media.size.height - media.padding.top - media.padding.bottom - 16;
          return SafeArea(
            minimum: const EdgeInsets.all(8),
            child: Material(
              type: MaterialType.transparency,
              child: Center(
                child: ConstrainedBox(
                  constraints: const BoxConstraints(maxWidth: 460),
                  child: SizedBox(
                    width: double.infinity,
                    height: availableHeight.clamp(0.0, 900.0).toDouble(),
                    child: _OnlineResultSheet(snapshot: snapshot),
                  ),
                ),
              ),
            ),
          );
        },
      );
'''
          if old not in source:
              raise SystemExit('result bottom-sheet block not found')
          path.write_text(source.replace(old, new, 1))
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Verify dialog carrier
        shell: bash
        run: |
          set -euo pipefail
          grep -q "showGeneralDialog<String>" lib/features/duel/online_duel_screen.dart
          ! grep -q "showModalBottomSheet<String>" lib/features/duel/online_duel_screen.dart
          grep -q "availableHeight" lib/features/duel/online_duel_screen.dart

      - name: Commit result dialog fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Open duel results in bounded dialog'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
