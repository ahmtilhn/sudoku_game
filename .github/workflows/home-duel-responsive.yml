name: Home Duel Responsive

on:
  push:
    branches:
      - home-duel-responsive

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Make Sudoku Duel artwork responsive
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/home/professional_home_screen.dart')
          source = path.read_text(encoding='utf-8')
          old = """    final artSize = data.primary
              ? compact
                    ? 48.0
                    : 78.0
              : compact
              ? 38.0
              : 60.0;
          """
          new = """    final baseArtSize = data.primary
              ? compact
                    ? 48.0
                    : 78.0
              : compact
              ? 38.0
              : 60.0;
          final viewport = MediaQuery.sizeOf(context);
          final duelArtScale =
              (viewport.shortestSide / 390.0).clamp(0.72, 1.0).toDouble();
          final artSize = data.asset == DuelAsset.homeDuelScene
              ? baseArtSize * duelArtScale
              : baseArtSize;
          """
          if old not in source:
              raise SystemExit('Expected HomeModeTile art-size block was not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')

      - name: Verify scope
        shell: python
        run: |
          from pathlib import Path
          source = Path('lib/features/home/professional_home_screen.dart').read_text(encoding='utf-8')
          required = [
              'final baseArtSize = data.primary',
              'viewport.shortestSide / 390.0',
              'data.asset == DuelAsset.homeDuelScene',
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              raise SystemExit(f'Missing responsive duel markers: {missing}')

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/features/home/professional_home_screen.dart

      - name: Analyze home screen
        run: flutter analyze --no-fatal-infos lib/features/home/professional_home_screen.dart

      - name: Run home responsive widget tests
        run: flutter test test/widget_test.dart

      - name: Check diff
        run: |
          git diff --check
          git diff -- lib/features/home/professional_home_screen.dart

      - name: Commit responsive duel artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/professional_home_screen.dart
          git commit -m "Make home Sudoku Duel artwork responsive"
          git push
