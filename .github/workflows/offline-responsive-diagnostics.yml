name: Offline responsive diagnostics

on:
  push:
    branches: [responsive-nonscroll-ui]
    paths:
      - '.github/workflows/offline-responsive-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failure-delta:
    strategy:
      fail-fast: false
      matrix:
        ref: [main, responsive-nonscroll-ui]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze responsive branch
        if: matrix.ref == 'responsive-nonscroll-ui'
        run: flutter analyze --no-fatal-infos
      - name: Report exact failing tests
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1 > /tmp/tests.log 2>&1
          status=$?
          set -e
          echo "ref=${{ matrix.ref }} test_exit=$status"
          echo '--- failing test descriptions ---'
          grep -E '^[0-9:]+ \+[0-9]+ -[0-9]+: .+ \[E\]$' /tmp/tests.log || true
          echo '--- source expectation failures ---'
          grep -n -B3 -A5 -E '^  Expected:|^    Actual:' /tmp/tests.log | tail -260 || true
          echo '--- summary ---'
          grep -E 'Some tests failed|All tests passed' /tmp/tests.log | tail -2 || true
          exit 0
