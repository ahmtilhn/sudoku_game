name: sudoku_game
description: A simple Sudoku career and online duel game built with Flutter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  app_tracking_transparency: ^2.0.7
  cupertino_icons: ^1.0.8
  facebook_app_events: ^0.30.3
  firebase_auth: ^6.5.6
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.1.0
  flutter_timezone: ^5.1.0
  gma_mediation_meta: ^1.5.3
  gma_mediation_unity: ^1.9.0
  google_mobile_ads: ^9.0.0
  http: ^1.6.0
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/localization/Localizable.xcstrings
