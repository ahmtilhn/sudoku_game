name: Finalize remaining portrait responsive cases

on:
  push:
    branches:
      - agent/portrait-responsive-overhaul
    paths:
      - .github/workflows/finalize_remaining_portrait_cases.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portrait-responsive-overhaul
          fetch-depth: 0
      - name: Patch store and duel tests
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          changed = 0
          store = Path('lib/features/economy/coin_store_screen.dart')
          text = store.read_text(encoding='utf-8')
          text, count = re.subn(
              r'SizedBox\(\n\s+width: 360,\n\s+child: Row\(',
              "ConstrainedBox(\n              constraints: const BoxConstraints(maxWidth: 360),\n              child: Row(",
              text,
              count=1,
          )
          changed += count
          text, count = re.subn(
              r'(product\.title,\n\s+maxLines:) 1,',
              r'\1 2,',
              text,
              count=1,
          )
          changed += count
          store.write_text(text, encoding='utf-8')

          test = Path('test/online_duel_screen_test.dart')
          text = test.read_text(encoding='utf-8')
          if "label: 'text scale 2.0 390x844'" not in text:
              pattern = re.compile(
                  r"(\s+_ViewportVariant\(\n\s+label: 'text scale 1\.3 390x844',\n\s+size: Size\(390, 844\),\n\s+brightness: Brightness\.dark,\n\s+textScale: 1\.3,\n\s+\),)"
              )
              addition = """
      _ViewportVariant(
        label: 'text scale 2.0 390x844',
        size: Size(390, 844),
        brightness: Brightness.dark,
        textScale: 2,
      ),"""
              text, count = pattern.subn(r'\1' + addition, text, count=1)
              changed += count
          test.write_text(text, encoding='utf-8')

          if changed != 3:
              raise SystemExit(f'Expected 3 responsive edits, applied {changed}')
          PY
          rm .github/workflows/finalize_remaining_portrait_cases.yml
      - name: Commit final responsive cases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish store and duel large-text coverage"
          git push origin HEAD:agent/portrait-responsive-overhaul
