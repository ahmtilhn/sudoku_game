name: Temporary result runtime fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-result-runtime-fix.yml'

permissions:
  contents: write

concurrency:
  group: tmp-result-runtime-fix-main
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply runtime-safe result patch
        run: python3 tool/tmp_result_runtime_fix.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/duel/online_duel_screen.dart
      - run: flutter analyze --fatal-infos lib/features/duel/online_duel_screen.dart

      - name: Verify runtime-sensitive layout contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "height: compact ? 82 : 92" lib/features/duel/online_duel_screen.dart
          grep -q "assets/ELO_rating_icons/cup.png" lib/features/duel/online_duel_screen.dart
          grep -q "assets/images/ui/defeat_trophy.png" lib/features/duel/online_duel_screen.dart
          grep -q "assets/images/ui/coin.png" lib/features/duel/online_duel_screen.dart

      - name: Commit UI/runtime fix only
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/features/duel/online_duel_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No result changes required.'
            exit 0
          fi
          git commit -m 'Fix result popup runtime layout and use UI assets'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
