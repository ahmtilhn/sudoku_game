name = "sudoku-duel-social-production"
main = "src/entry_v2.ts"
compatibility_date = "2026-07-24"

[vars]
FIREBASE_PROJECT_ID = "focus-sweep-503417-d7"
FIREBASE_PROJECT_NUMBER = "31445697560"
FCM_PROJECT_ID = "focus-sweep-503417-d7"
ALLOWED_ORIGIN = "*"
ALLOWED_APP_CHECK_APP_IDS = "1:31445697560:android:ed951eabf51d75800b2f6d,1:31445697560:ios:1f72f9fe671c75340b2f6d,1:31445697560:ios:44db104825e7d34e0b2f6d"
# Temporarily monitor App Check failures without blocking authenticated online
# traffic while Play Integrity release tokens are being repaired in Firebase.
REQUIRE_APP_CHECK = "false"
BUILD_COMMIT = "3ccd2290f797eb6ba59590ad48ac4235ac4a78e6"
ENVIRONMENT = "production"
ALLOW_TEST_PURCHASE_GRANTS = "false"
DEBUG_UNLIMITED_COINS = "false"
GOOGLE_PLAY_PACKAGE_NAME = "com.devoviastudio.sudoku"
GOOGLE_PUBSUB_AUDIENCE = "https://sudoku-duel-social-production.ilhanahmet246.workers.dev/v1/store/google/rtdn"
APPLE_BUNDLE_ID = "com.devovia.sudokuduel"
ADMOB_REWARDED_AD_UNITS = "ca-app-pub-8422988604275177/3474727600,ca-app-pub-8422988604275177/4787809275,ca-app-pub-8422988604275177/3366916396,ca-app-pub-8422988604275177/4982984468"

[[d1_databases]]
binding = "DB"
database_name = "sudoku-duel-social-production"
database_id = "c4d343a7-fddf-444e-b492-a00fcde905e6"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCHMAKING_QUEUE"
class_name = "MatchmakingQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingQueue"]

