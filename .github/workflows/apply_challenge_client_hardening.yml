name: Apply challenge client hardening

on:
  push:
    branches:
      - agent/challenge-system-hardening
    paths:
      - tool/apply_challenge_client_hardening.py
      - .github/workflows/apply_challenge_client_hardening.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/challenge-system-hardening' || github.ref_name == 'agent/challenge-system-hardening'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/challenge-system-hardening
          fetch-depth: 0
      - name: Apply client hardening with diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python tool/apply_challenge_client_hardening.py > tool/client_patch_diagnostic.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit result or diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.patch.outputs.exit_code }}" = "0" ]; then
            rm tool/apply_challenge_client_hardening.py
            rm tool/client_patch_diagnostic.txt
            rm .github/workflows/apply_challenge_client_hardening.yml
            git add -A
            git commit -m "Harden challenge client and surrender flow"
          else
            git add tool/client_patch_diagnostic.txt
            git commit -m "Record challenge client patch diagnostic"
          fi
          git push origin HEAD:agent/challenge-system-hardening
