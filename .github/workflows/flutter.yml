name: Flutter checks

on:
  push:
    branches: [main, 'agent/**']
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@v4
      - name: Resolve packages
        run: flutter pub get
      - name: Format sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
