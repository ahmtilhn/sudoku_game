name: Temporary Online Duel Reconnect Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/online-duel-reconnect-patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply reconnect, payout, and arena header fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          def replace_section(path, start, end, new):
              text = read(path)
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'start marker not found in {path}: {start!r}')
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'end marker not found in {path}: {end!r}')
              write(path, text[:i] + new + text[j:])

          # Backend state model: 30s grace and persisted pause bookkeeping.
          model = 'backend/social_worker/src/online_duel_model.ts'
          replace_once(model, 'export const DISCONNECT_GRACE_MS = 45_000;', 'export const DISCONNECT_GRACE_MS = 30_000;')
          replace_once(
              model,
              '  turnStartedAt: number | null;\n  turnDeadline: number | null;\n  revision: number;',
              '  turnStartedAt: number | null;\n  turnDeadline: number | null;\n  pauseStartedAt?: number | null;\n  pausedTurnRemainingMs?: number | null;\n  totalPausedMs?: number;\n  revision: number;',
          )

          engine = 'backend/social_worker/src/online_duel_engine.ts'
          replace_once(
              engine,
              '    turnStartedAt: null,\n    turnDeadline: null,\n    revision: 1,',
              '    turnStartedAt: null,\n    turnDeadline: null,\n    pauseStartedAt: null,\n    pausedTurnRemainingMs: null,\n    totalPausedMs: 0,\n    revision: 1,',
          )
          replace_once(
              engine,
              "  if (\n    (state.status === 'active' || state.status === 'paused') &&\n    state.startedAt !== null &&\n    now >= state.startedAt + MAX_MATCH_DURATION_MS\n  ) {",
              "  if (\n    state.status === 'active' &&\n    state.startedAt !== null &&\n    now >= state.startedAt + MAX_MATCH_DURATION_MS + (state.totalPausedMs ?? 0)\n  ) {",
          )
          replace_section(
              engine,
              'export function markConnected(',
              'export function markDisconnected(',
              '''export function markConnected(
  state: DuelState,
  seat: Seat,
  now: number,
): PublicEvent {
  const current = seatFor(state, seat);
  current.connected = true;
  current.lastSeenAt = now;
  current.disconnectDeadline = null;

  if (
    state.status === 'paused' &&
    state.finishedAt === null &&
    state.playerA.connected &&
    state.playerB.connected
  ) {
    const pausedAt = state.pauseStartedAt ?? now;
    const remaining = Math.max(
      1_000,
      Math.min(TURN_DURATION_MS, state.pausedTurnRemainingMs ?? TURN_DURATION_MS),
    );
    state.totalPausedMs =
      (state.totalPausedMs ?? 0) + Math.max(0, now - pausedAt);
    state.status = 'active';
    state.turnDeadline = now + remaining;
    state.turnStartedAt = now - Math.max(0, TURN_DURATION_MS - remaining);
    state.pauseStartedAt = null;
    state.pausedTurnRemainingMs = null;
  }

  state.revision++;
  return event(
    state,
    'player_presence',
    now,
    readinessPayload(state, { seat, connected: true }),
  );
}

''',
          )
          replace_section(
              engine,
              'export function markDisconnected(',
              'function rejectMove(',
              '''export function markDisconnected(
  state: DuelState,
  seat: Seat,
  now: number,
): PublicEvent {
  const current = seatFor(state, seat);
  current.connected = false;
  current.screenLoaded = false;
  current.lastSeenAt = now;

  if (
    state.startedAt !== null &&
    (state.status === 'active' || state.status === 'paused')
  ) {
    const grace = Math.min(
      DISCONNECT_GRACE_MS,
      Math.max(0, current.graceRemainingMs),
    );
    current.graceRemainingMs = Math.max(0, current.graceRemainingMs - grace);
    current.disconnectDeadline = now + Math.max(1_000, grace);

    if (state.status === 'active') {
      const remaining = state.turnDeadline === null
        ? TURN_DURATION_MS
        : Math.max(1_000, Math.min(TURN_DURATION_MS, state.turnDeadline - now));
      state.status = 'paused';
      state.pauseStartedAt = now;
      state.pausedTurnRemainingMs = remaining;
      state.turnDeadline = null;
    }
  }

  if (state.status === 'ready_window') {
    state.status = 'waiting';
    state.readyDeadline = null;
  }
  state.revision++;
  return event(
    state,
    'player_presence',
    now,
    readinessPayload(state, { seat, connected: false }),
  );
}

''',
