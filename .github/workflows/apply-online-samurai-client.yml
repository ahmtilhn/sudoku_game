name: Apply Online Samurai Client

on:
  push:
    branches: [feature/samurai-sudoku]
    paths:
      - 'tool/apply_online_samurai_client.py'
      - '.github/workflows/apply-online-samurai-client.yml'

permissions:
  contents: write

concurrency:
  group: apply-online-samurai-client
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/samurai-sudoku
          fetch-depth: 0
      - name: Apply Flutter client integration
        run: python3 tool/apply_online_samurai_client.py
      - name: Validate localization sources
        run: python3 tool/validate_localizations.py
      - name: Refresh UX audit
        run: python3 tool/generate_ux_audit.py --write
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze project
        run: flutter analyze --fatal-infos
      - name: Run tests
        run: flutter test --reporter expanded
      - name: Commit online client integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/services/online_duel_models.dart \
            lib/services/social_api_client.dart \
            lib/features/duel/matchmaking_screen.dart \
            lib/features/duel/online_duel_screen.dart \
            lib/localization/app_strings.dart \
            android/app/src/main/res/values/strings.xml \
            assets/localization/Localizable.xcstrings \
            docs/ux_audit.md
          if git diff --cached --quiet; then
            echo 'No client changes to commit.'
            exit 0
          fi
          git commit -m 'feat(samurai): integrate ranked online client'
          git pull --rebase origin feature/samurai-sudoku
          git push origin HEAD:feature/samurai-sudoku
