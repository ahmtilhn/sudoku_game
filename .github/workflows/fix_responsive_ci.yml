name: Apply final responsive CI fix

on:
  push:
    branches:
      - agent/portrait-responsive-overhaul
    paths:
      - .github/workflows/fix_responsive_ci.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portrait-responsive-overhaul
          fetch-depth: 0
      - name: Fix lint and import ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          home = Path('lib/features/home/ux_root_screen.dart')
          text = home.read_text()
          text = text.replace(
              "import 'package:flutter/material.dart';\n\nimport '../../widgets/responsive_layout.dart';\nimport 'package:flutter/services.dart';\nimport 'package:intl/intl.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\nimport 'package:intl/intl.dart';\n\nimport '../../widgets/responsive_layout.dart';",
          )
          text = text.replace(
              "    await _legacySessions.clearAll();\n    await Navigator.of(context).push<EnhancedGameExit>(",
              "    await _legacySessions.clearAll();\n    if (!mounted) return;\n    await Navigator.of(context).push<EnhancedGameExit>(",
              1,
          )
          home.write_text(text)

          matchmaking = Path('lib/features/duel/matchmaking_screen.dart')
          text = matchmaking.read_text().replace(
              "import 'package:flutter/material.dart';\n\nimport '../../widgets/responsive_layout.dart';\nimport 'package:intl/intl.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:intl/intl.dart';\n\nimport '../../widgets/responsive_layout.dart';",
          )
          matchmaking.write_text(text)

          game = Path('lib/features/game/enhanced_game_screen.dart')
          text = game.read_text().replace(
              "import 'package:flutter/material.dart';\n\nimport '../../widgets/responsive_layout.dart';\nimport 'package:flutter/services.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n\nimport '../../widgets/responsive_layout.dart';",
          )
          game.write_text(text)
          PY
          rm .github/workflows/fix_responsive_ci.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix responsive CI lint"
          git push origin HEAD:agent/portrait-responsive-overhaul
