name: Finalize RP identity fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-rank-identity-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-rank-identity-fast
  cancel-in-progress: false

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Detect already finalized UI
        id: state
        shell: bash
        run: |
          if grep -q 'final int? rankPoints;' lib/features/duel/matchmaking_stage.dart; then
            echo 'already=true' >> "$GITHUB_OUTPUT"
          else
            echo 'already=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply additive player-facing integration
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          python3 tool/finalize_rank_identity_integration.py
          git diff --check

      - uses: actions/setup-java@v4
        if: steps.state.outputs.already != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.state.outputs.already != 'true'
        with:
          channel: stable
          cache: true

      - name: Resolve and format
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          flutter pub get
          dart format \
            lib/features/duel/matchmaking_stage.dart \
            lib/features/duel/matchmaking_screen.dart \
            lib/features/duel/pre_match_ready_screen.dart \
            lib/features/social/social_hub_screen.dart \
            lib/features/social/friend_requests_screen.dart \
            lib/features/social/challenge_invitation_screen.dart \
            lib/features/social/platform_social_screen.dart \
            lib/features/home/home_screen.dart \
            lib/features/social/rank_identity_summary_card.dart \
            lib/features/social/profile_customization_screen.dart \
            test/rank_identity_public_ui_contract_test.dart

      - name: Validate backend rank layer
        if: steps.state.outputs.already != 'true'
        working-directory: backend/social_worker
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test

      - name: Validate Flutter integration
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          python3 tool/validate_localizations.py
          python3 tool/verify_user_facing_messages.py
          python3 tool/verify_ux_contracts.py
          flutter analyze --fatal-infos
          flutter test --reporter expanded \
            test/rank_identity_models_test.dart \
            test/rank_emblem_test.dart \
            test/rank_identity_public_ui_contract_test.dart

      - name: Commit focused-validated integration to main
        if: steps.state.outputs.already != 'true'
        run: |
          set -euo pipefail
          git add \
            lib/features/duel/matchmaking_stage.dart \
            lib/features/duel/matchmaking_screen.dart \
            lib/features/duel/pre_match_ready_screen.dart \
            lib/features/social/social_hub_screen.dart \
            lib/features/social/friend_requests_screen.dart \
            lib/features/social/challenge_invitation_screen.dart \
            lib/features/social/platform_social_screen.dart \
            lib/features/home/home_screen.dart \
            lib/features/social/rank_identity_summary_card.dart \
            lib/features/social/profile_customization_screen.dart \
            test/rank_identity_public_ui_contract_test.dart \
            backend/social_worker/test/rank_reward_migration.test.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize player-facing RP identity integration'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
