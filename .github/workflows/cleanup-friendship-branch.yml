name: Clean friendship branch artifacts

on:
  push:
    branches:
      - fix/friendship-state-hardening-20260830
    paths:
      - '.github/workflows/cleanup-friendship-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/friendship-state-hardening-20260830
          fetch-depth: 0
      - name: Restore unrelated files from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- analysis_options.yaml pubspec.lock
          rm -f .github/workflows/cleanup-friendship-branch.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove unrelated CI file changes'
          git push origin HEAD:fix/friendship-state-hardening-20260830
