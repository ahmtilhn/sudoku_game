name: Notification Validation

on:
  push:
    branches:
      - fix/notification-system-hardening

permissions:
  contents: read

jobs:
  notification-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze notification changes
        run: flutter analyze lib/main.dart lib/services/notification_platform_service.dart lib/services/push_notification_service.dart lib/services/reminder_notification_service.dart lib/features/home/push_room_navigation_gate.dart lib/features/social/challenge_navigation_gate.dart lib/features/social/player_identity_gate.dart lib/features/notifications/daily_reminder_destination_screen.dart test/notification_hardening_contract_test.dart test/android_notification_icon_config_test.dart
      - name: Notification regression tests
        run: flutter test test/notification_hardening_contract_test.dart test/android_notification_icon_config_test.dart test/challenge_client_hardening_test.dart
      - name: Android debug compile
        run: flutter build apk --debug

  notification-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/social_worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/social_worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
