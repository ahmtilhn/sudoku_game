name: sudoku_game
description: A simple Sudoku career and online duel game built with Flutter.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.1.0
  flutter_timezone: ^5.1.0
  intl: any
  shared_preferences: ^2.5.3
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/localization/Localizable.xcstrings
