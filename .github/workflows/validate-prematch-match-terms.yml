name: Validate prematch match terms

on:
  push:
    branches:
      - fix/prematch-match-terms

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/prematch-match-terms
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/features/duel/matchmaking_screen.dart lib/features/duel/pre_match_ready_screen.dart lib/features/duel/prematch_match_terms_card.dart test/prematch_match_terms_contract_test.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Focused prematch terms tests
        run: flutter test --reporter expanded test/prematch_match_terms_contract_test.dart
      - name: Commit formatting and remove temporary validation workflow
        if: success()
        shell: bash
        run: |
          rm .github/workflows/validate-prematch-match-terms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/duel/matchmaking_screen.dart \
                  lib/features/duel/pre_match_ready_screen.dart \
                  lib/features/duel/prematch_match_terms_card.dart \
                  test/prematch_match_terms_contract_test.dart \
                  .github/workflows/validate-prematch-match-terms.yml
          if ! git diff --cached --quiet; then
            git commit -m "Format and validate prematch match terms"
            git push origin HEAD:fix/prematch-match-terms
          fi
