name = "sudoku-duel-social-production"
main = "src/entry.ts"
compatibility_date = "2026-07-24"

[vars]
FIREBASE_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
FIREBASE_PROJECT_NUMBER = "REPLACE_WITH_FIREBASE_PROJECT_NUMBER"
FCM_PROJECT_ID = "REPLACE_WITH_FIREBASE_PROJECT_ID"
ALLOWED_ORIGIN = "*"
ALLOWED_APP_CHECK_APP_IDS = "REPLACE_WITH_ANDROID_APP_ID,REPLACE_WITH_IOS_APP_ID"
REQUIRE_APP_CHECK = "true"
BUILD_COMMIT = "REPLACE_WITH_GIT_COMMIT_SHA"
ENVIRONMENT = "production"
ALLOW_TEST_PURCHASE_GRANTS = "false"
DEBUG_UNLIMITED_COINS = "false"
GOOGLE_PLAY_PACKAGE_NAME = "com.devoviastudio.sudoku"
GOOGLE_PUBSUB_AUDIENCE = "REPLACE_WITH_GOOGLE_PUBSUB_PUSH_AUDIENCE"
GOOGLE_PUBSUB_SERVICE_ACCOUNT = "REPLACE_WITH_GOOGLE_PUBSUB_PUSH_SERVICE_ACCOUNT"
APPLE_BUNDLE_ID = "com.devoviastudio.sudoku"
ADMOB_REWARDED_AD_UNITS = "ca-app-pub-8422988604275177/3474727600,ca-app-pub-8422988604275177/4787809275,ca-app-pub-8422988604275177/3366916396,ca-app-pub-8422988604275177/4982984468"

[[d1_databases]]
binding = "DB"
database_name = "sudoku-duel-social-production"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "MATCHMAKING_QUEUE"
class_name = "MatchmakingQueue"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["MatchmakingQueue"]

# Configure secrets with Wrangler; never commit secret values:
# wrangler secret put FCM_CLIENT_EMAIL --config wrangler.production.toml
# wrangler secret put FCM_PRIVATE_KEY --config wrangler.production.toml
# wrangler secret put GOOGLE_PLAY_CLIENT_EMAIL --config wrangler.production.toml
# wrangler secret put GOOGLE_PLAY_PRIVATE_KEY --config wrangler.production.toml
# wrangler secret put APPLE_IAP_ISSUER_ID --config wrangler.production.toml
# wrangler secret put APPLE_IAP_KEY_ID --config wrangler.production.toml
# wrangler secret put APPLE_IAP_PRIVATE_KEY --config wrangler.production.toml
# APPLE_ROOT_CERTIFICATES_PEM must contain one or more trusted Apple root
# certificates downloaded from Apple PKI, including BEGIN/END CERTIFICATE lines.
# wrangler secret put APPLE_ROOT_CERTIFICATES_PEM --config wrangler.production.toml
#
# Google Play Pub/Sub push URL:
#   https://<production-worker-host>/v1/store/google/rtdn
# Use GOOGLE_PUBSUB_AUDIENCE as the exact OIDC audience configured on the push
# subscription and GOOGLE_PUBSUB_SERVICE_ACCOUNT as the authenticated push
# service account email.
#
# App Store Server Notifications V2 URL:
#   https://<production-worker-host>/v1/store/apple/notifications
