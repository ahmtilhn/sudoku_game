name: Fix remaining UX lints

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-main-ux-lints.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-main-ux-lints
  cancel-in-progress: false

jobs:
  fix-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply analyzer fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          brace_files = [
              'lib/features/social/challenge_invitation_screen.dart',
              'lib/features/social/google_play_games_screen.dart',
              'lib/features/social/platform_services_screen.dart',
              'lib/features/social/platform_social_screen.dart',
              'lib/features/social/social_hub_screen.dart',
              'lib/features/social/ux_challenge_invitation_screen.dart',
          ]
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)if \((?P<condition>!?mounted)\)\n'
              r'(?P<body_indent>\s+)(?P<body>[^\n{}]+;)\s*$'
          )
          total = 0
          for relative in brace_files:
              path = Path(relative)
              source = path.read_text()
              def wrap(match):
                  return (
                      f"{match.group('indent')}if ({match.group('condition')}) {{\n"
                      f"{match.group('body_indent')}{match.group('body')}\n"
                      f"{match.group('indent')}}}"
                  )
              source, count = pattern.subn(wrap, source)
              total += count
              path.write_text(source)
          if total != 22:
              raise SystemExit(f'Expected 22 unbraced mounted checks, fixed {total}.')

          replacements = {
              'lib/features/duel/matchmaking_screen.dart': [
                  (
                      "    } on FirebaseSessionException catch (error) {\n"
                      "      _stopSearchWithError(UserSafeError.message(context, error));",
                      "    } on FirebaseSessionException catch (error) {\n"
                      "      if (!mounted) return;\n"
                      "      _stopSearchWithError(UserSafeError.message(context, error));",
                  ),
                  (
                      "      _stopSearchWithError(UserSafeError.message(context, error));\n"
                      "    } catch (_) {",
                      "      if (!mounted) return;\n"
                      "      _stopSearchWithError(UserSafeError.message(context, error));\n"
                      "    } catch (_) {",
                  ),
              ],
              'lib/features/settings/account_protection_screen.dart': [
                  (
                      "    } on FirebaseSessionException catch (error) {\n"
                      "      _error = UserSafeError.message(context, error);",
                      "    } on FirebaseSessionException catch (error) {\n"
                      "      if (!mounted) return;\n"
                      "      _error = UserSafeError.message(context, error);",
                  ),
                  (
                      "    } on AccountDeletionException catch (error) {\n"
                      "      _error = UserSafeError.message(context, error);",
                      "    } on AccountDeletionException catch (error) {\n"
                      "      if (!mounted) return;\n"
                      "      _error = UserSafeError.message(context, error);",
                  ),
              ],
              'lib/features/social/platform_social_screen.dart': [
                  (
                      "    } on PlatformGameServicesException catch (error) {\n"
                      "      _showMessage(UserSafeError.message(context, error));",
                      "    } on PlatformGameServicesException catch (error) {\n"
                      "      if (!mounted) return;\n"
                      "      _showMessage(UserSafeError.message(context, error));",
                  ),
                  (
                      "    } on SocialApiException catch (error) {\n"
                      "      _showMessage(UserSafeError.message(context, error));",
                      "    } on SocialApiException catch (error) {\n"
                      "      if (!mounted) return;\n"
                      "      _showMessage(UserSafeError.message(context, error));",
                  ),
              ],
          }
          expected_counts = {
              ('lib/features/duel/matchmaking_screen.dart', 0): 1,
              ('lib/features/duel/matchmaking_screen.dart', 1): 1,
              ('lib/features/settings/account_protection_screen.dart', 0): 2,
              ('lib/features/settings/account_protection_screen.dart', 1): 1,
              ('lib/features/social/platform_social_screen.dart', 0): 1,
              ('lib/features/social/platform_social_screen.dart', 1): 3,
          }
          for relative, items in replacements.items():
              path = Path(relative)
              source = path.read_text()
              for index, (old, new) in enumerate(items):
                  count = source.count(old)
                  expected = expected_counts[(relative, index)]
                  if count != expected:
                      raise SystemExit(
                          f'{relative}: expected {expected} matches for fix {index}, found {count}'
                      )
                  source = source.replace(old, new)
              path.write_text(source)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Validate localization
        run: python3 tool/validate_localizations.py

      - name: Verify user-safe messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit verified fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib test
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Resolve remaining user-facing UX analyzer findings'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
