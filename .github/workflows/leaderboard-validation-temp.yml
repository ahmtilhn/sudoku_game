name: Temporary leaderboard validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/leaderboard-validation-temp.yml'

permissions:
  contents: read

concurrency:
  group: temporary-leaderboard-validation
  cancel-in-progress: true

jobs:
  validate-leaderboards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        run: flutter pub get
      - name: Analyze leaderboard changes
        run: >-
          flutter analyze --fatal-infos
          lib/features/duel/leaderboards_screen.dart
          lib/services/competitive_leaderboard_api.dart
          lib/services/platform_leaderboard_service.dart
      - name: Run leaderboard regression tests
        run: >-
          flutter test --reporter expanded --concurrency=1
          test/platform_leaderboard_service_test.dart
          test/online_duel_leaderboard_mirror_test.dart
          test/home_profile_leaderboard_upgrade_test.dart
