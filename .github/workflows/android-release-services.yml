name: Android release services

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-release-services.yml"
      - "android/**"
      - "assets/**"
      - "backend/**"
      - "docs/**"
      - "lib/**"
      - "test/**"
      - "tool/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-main
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      APP_ENVIRONMENT: production
      BUILD_COMMIT: ${{ github.sha }}
      SOCIAL_BACKEND_URL: ${{ vars.PRODUCTION_SOCIAL_BACKEND_URL }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Show tool versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Validate localization catalog
        run: python3 tool/validate_localizations.py

      - name: Verify user-safe messages
        run: python3 tool/verify_user_facing_messages.py

      - name: Verify UX contracts
        run: python3 tool/verify_ux_contracts.py

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Verify release configuration
        shell: pwsh
        run: ./tool/verify_android_release_config.ps1

      - name: Require production backend URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOCIAL_BACKEND_URL"

      - name: Create ephemeral CI upload key
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore android/ci-upload.jks \
            -storepass changeit \
            -keypass changeit \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname "CN=Sudoku Duel CI, OU=CI, O=Devovia, L=CI, ST=CI, C=NL"
          cat > android/key.properties <<'EOF'
          storeFile=ci-upload.jks
          storePassword=changeit
          keyAlias=ci-upload
          keyPassword=changeit
          EOF

      - name: Build release app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=APP_ENVIRONMENT=${APP_ENVIRONMENT}
          --dart-define=SOCIAL_BACKEND_URL=${SOCIAL_BACKEND_URL}
          --dart-define=BUILD_COMMIT=${BUILD_COMMIT}

      - name: Inspect release app bundle
        shell: pwsh
        run: |
          ./tool/verify_online_aab.ps1 `
            -Path "./build/app/outputs/bundle/release/app-release.aab"

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-duel-0.1.20-35-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
