name: Finalize challenge hardening

on:
  push:
    branches:
      - agent/challenge-system-hardening
    paths:
      - tool/finalize_challenge_hardening.py
      - .github/workflows/finalize_challenge_hardening.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/challenge-system-hardening
          fetch-depth: 0
      - name: Apply final cleanup
        run: python tool/finalize_challenge_hardening.py
      - name: Remove temporary files
        run: |
          rm tool/finalize_challenge_hardening.py
          rm .github/workflows/finalize_challenge_hardening.yml
      - name: Commit finalized challenge hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize challenge lifecycle hardening"
          git push origin HEAD:agent/challenge-system-hardening
