name: Temporary Pixabay Sound Pack Builder

on:
  push:
    branches:
      - tmp/pixabay-sound-pack-20260830

permissions:
  contents: read

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download verified Pixabay masters and build complete game pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, html, json, os, re, shutil, subprocess, sys, urllib.request
          from pathlib import Path

          ROOT = Path('pixabay_sound_pack')
          MASTERS = ROOT / 'masters'
          RUNTIME = ROOT / 'runtime'
          MASTERS.mkdir(parents=True, exist_ok=True)
          RUNTIME.mkdir(parents=True, exist_ok=True)

          sources = {
              'soft_ui_click': ('Soft UI Click', 'https://pixabay.com/sound-effects/film-special-effects-soft-ui-click-147352/'),
              'menu_click': ('Menu Click', 'https://pixabay.com/sound-effects/film-special-effects-menu-click-147357/'),
              'soft_interface_click': ('Soft Interface Click', 'https://pixabay.com/sound-effects/film-special-effects-soft-interface-click-126517/'),
              'success_notification': ('Success Notification', 'https://pixabay.com/sound-effects/film-special-effects-success-notification-132473/'),
              'error_notification_08': ('Error Notification 08', 'https://pixabay.com/sound-effects/film-special-effects-error-notification-08-206492/'),
              'ui_interface_03': ('UI Interface 03', 'https://pixabay.com/sound-effects/film-special-effects-ui-interface-03-277552/'),
              'level_complete': ('Level Complete', 'https://pixabay.com/sound-effects/film-special-effects-level-complete-143022/'),
              'level_passed': ('Level Passed', 'https://pixabay.com/sound-effects/film-special-effects-level-passed-142971/'),
              'new_notification_051': ('New Notification 051', 'https://pixabay.com/sound-effects/technology-new-notification-051-494246/'),
              'new_level_unlocked': ('New Level Unlocked', 'https://pixabay.com/sound-effects/film-special-effects-new-level-unlocked-143027/'),
              'reward_chime': ('Reward Chime', 'https://pixabay.com/sound-effects/film-special-effects-reward-chime-144757/'),
              'bonus_earned': ('Bonus Earned', 'https://pixabay.com/sound-effects/film-special-effects-bonus-earned-143026/'),
              'level_up_06': ('Level Up 06', 'https://pixabay.com/sound-effects/level-up-06-370051/'),
              'achievement_unlock': ('Achievement Unlock', 'https://pixabay.com/sound-effects/film-special-effects-achievement-unlock-243762/'),
              'coin_drop': ('Coin Drop', 'https://pixabay.com/sound-effects/film-special-effects-coin-drop-229314/'),
              'victory_fanfare': ('Victory Fanfare', 'https://pixabay.com/sound-effects/musical-victory-fanfare-152480/'),
              'marimba_game_over': ('Marimba Game Over', 'https://pixabay.com/sound-effects/film-special-effects-marimba-game-over-250960/'),
          }

          def find_content_url(obj):
              if isinstance(obj, dict):
                  for key in ('contentUrl', 'contentURL'):
                      value = obj.get(key)
                      if isinstance(value, str) and value.startswith('http'):
                          return value
                  for value in obj.values():
                      found = find_content_url(value)
                      if found:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = find_content_url(value)
                      if found:
                          return found
              return None

          def fetch_page(url):
              cmd = ['curl', '-fsSL', '--retry', '4', '--retry-delay', '2', '-A', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36', url]
              return subprocess.check_output(cmd, text=True)

          def extract_audio_url(page):
              blocks = re.findall(r'<script[^>]*type=["\']application/ld\+json["\'][^>]*>(.*?)</script>', page, flags=re.I|re.S)
              for raw in blocks:
                  raw = html.unescape(raw.strip())
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  found = find_content_url(data)
                  if found and ('pixabay.com' in found or 'cdn.pixabay.com' in found):
                      return found.replace('\\u0026', '&')
              patterns = [
                  r'https:\\/\\/cdn\.pixabay\.com\\/download\\/audio\\/[^"\'<>\\s]+',
                  r'https://cdn\.pixabay\.com/download/audio/[^"\'<>\s]+',
              ]
              for pattern in patterns:
                  m = re.search(pattern, page)
                  if m:
                      return html.unescape(m.group(0).replace('\\/', '/').replace('\\u0026', '&'))
              return None

          manifest = []
          failed = []
          for key, (title, page_url) in sources.items():
              print(f'::group::{title}')
              try:
                  page = fetch_page(page_url)
                  audio_url = extract_audio_url(page)
                  if not audio_url:
                      raise RuntimeError('No contentUrl/CDN audio URL found in page HTML')
                  out = MASTERS / f'{key}.mp3'
                  subprocess.check_call([
                      'curl', '-fL', '--retry', '4', '--retry-delay', '2',
                      '-A', 'Mozilla/5.0', '-e', page_url,
                      audio_url, '-o', str(out)
                  ])
                  if out.stat().st_size < 1000:
                      raise RuntimeError(f'Downloaded file too small: {out.stat().st_size} bytes')
                  probe = subprocess.run(['ffprobe', '-v', 'error', '-show_entries', 'format=duration', '-of', 'default=nw=1:nk=1', str(out)], capture_output=True, text=True)
                  duration = probe.stdout.strip() if probe.returncode == 0 else ''
                  manifest.append((key, title, page_url, audio_url, out.stat().st_size, duration))
                  print(f'Downloaded {out} ({out.stat().st_size} bytes, {duration}s)')
              except Exception as exc:
                  failed.append((key, title, page_url, str(exc)))
                  print(f'ERROR: {title}: {exc}', file=sys.stderr)
              finally:
                  print('::endgroup::')

          if failed:
              print('\nFAILED SOURCES:', file=sys.stderr)
              for item in failed:
                  print(item, file=sys.stderr)
              raise SystemExit(2)

          events = [
              ('ui','ui_click','soft_ui_click','General menu/button tap'),
              ('ui','ui_primary_click','menu_click','Primary CTA such as Play/Claim/Buy'),
              ('ui','ui_back','menu_click','Back/close navigation'),
              ('ui','ui_modal_open','ui_interface_03','Dialog/modal open'),
              ('ui','ui_modal_close','soft_ui_click','Dialog/modal close'),
              ('ui','ui_toggle_on','success_notification','Toggle enabled'),
              ('ui','ui_toggle_off','menu_click','Toggle disabled'),
              ('ui','ui_tab','soft_ui_click','Tab/navigation selection'),
              ('ui','ui_select','soft_interface_click','Dropdown/list selection'),
              ('ui','ui_disabled_error','error_notification_08','Disabled/invalid tap feedback'),
              ('gameplay','cell_select','soft_ui_click','Sudoku cell selection'),
              ('gameplay','number_input','soft_interface_click','Normal number placement'),
              ('gameplay','correct_move','success_notification','Correct move feedback'),
              ('gameplay','wrong_move','error_notification_08','Wrong move feedback'),
              ('gameplay','notes_mode_on','success_notification','Pencil/notes mode on'),
              ('gameplay','notes_mode_off','menu_click','Pencil/notes mode off'),
              ('gameplay','note_add','soft_interface_click','Pencil note added'),
              ('gameplay','note_remove','menu_click','Pencil note removed'),
              ('gameplay','erase','menu_click','Erase number/note'),
              ('gameplay','undo','ui_interface_03','Undo action'),
              ('gameplay','hint_activate','ui_interface_03','Hint requested'),
              ('gameplay','hint_apply','success_notification','Hint revealed/applied'),
              ('gameplay','unit_complete','level_complete','Row/column/box completed'),
              ('gameplay','puzzle_complete','level_passed','Puzzle completed'),
              ('gameplay','perfect_game','achievement_unlock','Perfect puzzle completion'),
              ('gameplay','puzzle_failed','marimba_game_over','Puzzle failed / mistakes exhausted'),
              ('career','career_level_start','new_level_unlocked','Career level start'),
              ('career','career_level_complete','level_passed','Career level completed'),
              ('career','career_stage_unlock','new_level_unlocked','New career stage unlocked'),
              ('online','matchmaking_started','ui_interface_03','Started searching for opponent'),
              ('online','match_found','new_notification_051','Opponent found'),
              ('online','matchmaking_cancelled','menu_click','Matchmaking cancelled'),
              ('online','matchmaking_failed','error_notification_08','Matchmaking failed'),
              ('online','ready','success_notification','Local player ready'),
              ('online','opponent_ready','new_notification_051','Opponent became ready'),
              ('online','countdown_tick','ui_interface_03','Countdown 10 through 4'),
              ('online','countdown_3','ui_interface_03','Countdown 3'),
              ('online','countdown_2','ui_interface_03','Countdown 2'),
              ('online','countdown_1','ui_interface_03','Countdown 1'),
              ('online','match_start','new_level_unlocked','GO / online match starts'),
              ('online','opponent_mistake','error_notification_08','Optional opponent mistake cue'),
              ('online','take_lead','success_notification','Optional player takes lead'),
              ('online','lose_lead','error_notification_08','Optional opponent takes lead'),
              ('online','online_victory','victory_fanfare','Won online match'),
              ('online','online_defeat','marimba_game_over','Lost online match'),
              ('online','opponent_surrendered','level_passed','Opponent surrendered / win'),
              ('online','opponent_disconnected','error_notification_08','Opponent disconnected'),
              ('online','reconnected','success_notification','Connection restored'),
              ('social','emote_send','soft_ui_click','Emote sent'),
              ('social','emote_receive','new_notification_051','Emote received'),
              ('social','friend_request_sent','success_notification','Friend request sent'),
              ('social','friend_request_received','new_notification_051','Friend request received'),
              ('social','friend_request_accepted','reward_chime','Friend request accepted'),
              ('social','friend_removed','menu_click','Friend removed'),
              ('social','challenge_sent','success_notification','Challenge sent'),
              ('social','challenge_received','new_notification_051','Challenge received'),
              ('social','challenge_accepted','reward_chime','Challenge accepted'),
              ('rank','elo_gain','level_up_06','ELO/RP gained'),
              ('rank','elo_loss','error_notification_08','ELO/RP lost'),
              ('rank','rank_step_up','level_up_06','III -> II -> I promotion'),
              ('rank','rank_promotion','achievement_unlock','League promotion, e.g. Bronze -> Silver'),
              ('rank','rank_demotion','marimba_game_over','League demotion'),
              ('economy','coin_small','coin_drop','Small coin reward'),
              ('economy','coin_bundle','bonus_earned','Coin bundle reward'),
              ('economy','coin_large','reward_chime','Large coin reward'),
              ('economy','reward_x2','bonus_earned','Double reward'),
              ('economy','coin_spend','coin_drop','Coin spent'),
              ('economy','insufficient_coins','error_notification_08','Not enough coins'),
              ('rewards','daily_reward_claim','reward_chime','Daily reward claimed'),
              ('rewards','daily_reward_x2','bonus_earned','Daily reward doubled'),
              ('rewards','streak_milestone','achievement_unlock','Reward streak milestone'),
              ('rewards','achievement_unlocked','achievement_unlock','Achievement unlocked'),
              ('rewards','rare_achievement','victory_fanfare','Rare/high-tier achievement'),
              ('profile','profile_item_select','soft_ui_click','Avatar/frame/badge/title selected'),
              ('profile','profile_item_equipped','success_notification','Customization equipped'),
              ('profile','cosmetic_unlocked','reward_chime','Cosmetic unlocked'),
              ('profile','locked_item','error_notification_08','Locked cosmetic tapped'),
              ('shop','shop_item_select','soft_ui_click','Shop item selected'),
              ('shop','shop_buy_button','menu_click','Buy button pressed'),
              ('shop','purchase_success','reward_chime','IAP purchase completed'),
              ('shop','purchase_failed','error_notification_08','IAP purchase failed'),
              ('shop','purchase_restored','success_notification','Purchase restored'),
              ('ads','ad_reward_granted','reward_chime','Rewarded ad reward granted'),
              ('ads','ad_reward_doubled','bonus_earned','Rewarded ad x2 applied'),
              ('system','generic_success','success_notification','Generic successful action'),
              ('system','generic_error','error_notification_08','Generic error'),
              ('system','connection_lost','error_notification_08','Social/backend connection lost'),
              ('system','connection_restored','success_notification','Social/backend connection restored'),
          ]

          source_by_key = {k: (t, u) for k,(t,u) in sources.items()}
          event_rows = []
          for category, event, master, note in events:
              src = MASTERS / f'{master}.mp3'
              dest_dir = RUNTIME / category
              dest_dir.mkdir(parents=True, exist_ok=True)
              dest = dest_dir / f'{event}.mp3'
              shutil.copy2(src, dest)
              title, page = source_by_key[master]
              event_rows.append((category, event, str(dest.relative_to(ROOT)), master, title, page, note))

          with (ROOT / 'MASTER_SOURCES.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['master_key','pixabay_title','pixabay_page','resolved_audio_url','bytes','duration_seconds'])
              w.writerows(manifest)

          with (ROOT / 'SOUND_CATALOG.csv').open('w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['category','event_key','file','master_key','pixabay_title','pixabay_page','usage'])
              w.writerows(event_rows)

          silent = [
              'Opponent normal move: intentionally visual-only to avoid repetitive ticking.',
              'Friend request declined: intentionally silent.',
              'Challenge declined: intentionally silent.',
              'Ad start/interstitial open: intentionally silent; ad SDK controls its own audio.',
              'Daily reward merely becoming available: intentionally visual-only until Claim.',
          ]
          readme = [
              '# SudokuGame Pixabay Sound Pack', '',
              'All 17 master sounds in this pack are from the same Pixabay creator: **Universfield**.',
              'The runtime folders contain a complete event-ready naming layer for the game; several events intentionally reuse the same master sound to keep a coherent sonic family.', '',
              f'- Master source files: {len(manifest)}',
              f'- Runtime event files: {len(event_rows)}',
              '- Format: MP3 as served by Pixabay',
              '- License: Pixabay Content License (verify current terms before release)', '',
              '## Intentionally silent events',
          ] + [f'- {x}' for x in silent] + [
              '', '## Files',
              '- `masters/`: original downloaded Pixabay master files.',
              '- `runtime/`: game-event filenames ready to copy into the Flutter asset tree.',
              '- `MASTER_SOURCES.csv`: exact Pixabay page and resolved CDN URL for every original.',
              '- `SOUND_CATALOG.csv`: mapping from every game event to its source/master.',
              '', 'Generated automatically for SudokuGame on 2026-08-30.'
          ]
          (ROOT / 'README.md').write_text('\n'.join(readme) + '\n', encoding='utf-8')

          print(f'Built {len(manifest)} masters and {len(event_rows)} runtime files.')
          PY

          find pixabay_sound_pack -type f -print | sort
          zip -r sudoku_pixabay_sound_pack_2026-08-30.zip pixabay_sound_pack >/dev/null
          ls -lh sudoku_pixabay_sound_pack_2026-08-30.zip

      - name: Upload downloadable sound pack
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-pixabay-sound-pack
          path: sudoku_pixabay_sound_pack_2026-08-30.zip
          if-no-files-found: error
          retention-days: 7
