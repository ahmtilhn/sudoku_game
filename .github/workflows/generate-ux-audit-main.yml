name: Generate complete UX audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-ux-audit-main.yml'
      - 'tool/generate_ux_audit.py'
      - 'lib/features/**'
      - 'lib/widgets/**'
      - 'lib/core/user_safe_error.dart'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-ux-audit-main-v2
  cancel-in-progress: false

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Generate audit
        run: python3 tool/generate_ux_audit.py --write

      - name: Commit audit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add docs/ux_audit.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Audit already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Document complete production screen UX audit'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
