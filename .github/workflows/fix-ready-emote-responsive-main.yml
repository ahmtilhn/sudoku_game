name: Fix ready emote responsive layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ready-emote-responsive-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2

      - name: Make ready emotes layout-safe
        shell: python
        run: |
          from pathlib import Path

          hub_path = Path('lib/services/online_duel_emote_hub.dart')
          hub = hub_path.read_text()
          old = """        return Column(
          key: const ValueKey<String>('online-duel-inline-emotes'),
          mainAxisSize: MainAxisSize.min,
          children: [
            OnlineDuelEmoteBubble(emoteId: hub.incomingEmoteId, accent: color),
            SizedBox(height: compact ? 2 : 4),
            _EmoteRoundButton(
              hub: hub,
              dimension: compact ? 48 : 50,
              onTap: () => showOnlineDuelEmotePicker(context, hub),
            ),
          ],
        );"""
          new = """        if (compact) {
          const dimension = 48.0;
          const bubbleScale = .70;
          return SizedBox.square(
            key: const ValueKey<String>('online-duel-inline-emotes'),
            dimension: dimension,
            child: Stack(
              clipBehavior: Clip.none,
              children: [
                PositionedDirectional(
                  start: dimension + 6,
                  bottom: 0,
                  child: IgnorePointer(
                    child: Transform.scale(
                      scale: bubbleScale,
                      alignment: AlignmentDirectional.bottomStart,
                      child: OnlineDuelEmoteBubble(
                        emoteId: hub.incomingEmoteId,
                        accent: color,
                      ),
                    ),
                  ),
                ),
                PositionedDirectional(
                  start: 0,
                  bottom: 0,
                  child: _EmoteRoundButton(
                    hub: hub,
                    dimension: dimension,
                    onTap: () => showOnlineDuelEmotePicker(context, hub),
                  ),
                ),
              ],
            ),
          );
        }
        return Column(
          key: const ValueKey<String>('online-duel-inline-emotes'),
          mainAxisSize: MainAxisSize.min,
          children: [
            OnlineDuelEmoteBubble(emoteId: hub.incomingEmoteId, accent: color),
            const SizedBox(height: 4),
            _EmoteRoundButton(
              hub: hub,
              dimension: 50,
              onTap: () => showOnlineDuelEmotePicker(context, hub),
            ),
          ],
        );"""
          if old not in hub:
              raise SystemExit('Inline emote surface block not found')
          hub_path.write_text(hub.replace(old, new, 1))

          test_path = Path('test/pre_match_ready_emote_screen_test.dart')
          test = test_path.read_text()
          old_test = """    expect(find.byIcon(Icons.front_hand_rounded), findsOneWidget);
  });"""
          new_test = """    expect(find.byIcon(Icons.front_hand_rounded), findsOneWidget);
    expect(tester.takeException(), isNull);

    final inlineSurface = find.byKey(
      const ValueKey<String>('online-duel-inline-emotes'),
    );
    expect(inlineSurface, findsOneWidget);
    expect(tester.getSize(inlineSurface).height, lessThanOrEqualTo(56));
  });"""
          if old_test not in test:
              raise SystemExit('Ready emote regression assertion block not found')
          test_path.write_text(test.replace(old_test, new_test, 1))

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/services/online_duel_emote_hub.dart test/pre_match_ready_emote_screen_test.dart
      - run: flutter analyze --fatal-infos lib/services/online_duel_emote_hub.dart test/pre_match_ready_emote_screen_test.dart
      - run: flutter test test/pre_match_ready_emote_screen_test.dart

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const bubbleScale = .70" lib/services/online_duel_emote_hub.dart
          grep -q "tester.takeException(), isNull" test/pre_match_ready_emote_screen_test.dart
          git checkout -- analysis_options.yaml pubspec.lock 2>/dev/null || true
          git add lib/services/online_duel_emote_hub.dart test/pre_match_ready_emote_screen_test.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix responsive ready-room emotes [skip ci]'
          git push origin HEAD:main
