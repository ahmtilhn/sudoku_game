name: Fix Home Logo Responsive

on:
  push:
    branches:
      - fix-home-logo-responsive-contain

permissions:
  contents: write

jobs:
  patch-test-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Make main logo fully visible
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/features/home/professional_home_screen.dart')
          source = path.read_text(encoding='utf-8')
          start = source.index('class _HomeLogo extends StatelessWidget {')
          end = source.index('\nclass _HomeHeader extends StatelessWidget {', start)
          replacement = '''class _HomeLogo extends StatelessWidget {
            const _HomeLogo({required this.compact, required this.tight});

            final bool compact;
            final bool tight;

            @override
            Widget build(BuildContext context) {
              return SizedBox(
                key: const ValueKey<String>('home-logo-text'),
                height: tight
                    ? 44
                    : compact
                    ? 72
                    : 180,
                width: double.infinity,
                child: Center(
                  child: Image.asset(
                    'assets/images/ui/logo_text.png',
                    width: double.infinity,
                    height: double.infinity,
                    fit: BoxFit.contain,
                    alignment: Alignment.center,
                    filterQuality: FilterQuality.high,
                    errorBuilder: (context, error, stackTrace) => Center(
                      child: Text(
                        context.tr('app_name').toUpperCase(),
                        textAlign: TextAlign.center,
                        style: TextStyle(
                          color: Colors.white,
                          fontSize: tight
                              ? 22
                              : compact
                              ? 28
                              : 42,
                          height: 1,
                          fontWeight: FontWeight.w900,
                          letterSpacing: .9,
                        ),
                      ),
                    ),
                  ),
                ),
              );
            }
          }
          '''
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')

      - name: Verify logo contract
        shell: python
        run: |
          from pathlib import Path
          source = Path('lib/features/home/professional_home_screen.dart').read_text(encoding='utf-8')
          start = source.index('class _HomeLogo extends StatelessWidget {')
          end = source.index('class _HomeHeader extends StatelessWidget {', start)
          logo = source[start:end]
          assert "fit: BoxFit.contain" in logo
          assert "fit: BoxFit.fitWidth" not in logo
          assert "ClipRect" not in logo
          assert "assets/images/ui/logo_text.png" in logo

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/features/home/professional_home_screen.dart

      - name: Analyze home screen
        run: flutter analyze --no-fatal-infos lib/features/home/professional_home_screen.dart

      - name: Run home responsive tests
        run: flutter test test/widget_test.dart

      - name: Check diff
        run: |
          git diff --check
          git diff -- lib/features/home/professional_home_screen.dart

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/home/professional_home_screen.dart
          git commit -m "Keep main menu logo fully visible on tablets"
          git push
