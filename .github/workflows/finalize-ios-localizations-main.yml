name: Finalize generated iOS localization catalog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ios-localizations-main.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: finalize-ios-localizations-main
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Download verified locale artifacts
        uses: actions/download-artifact@v5
        with:
          repository: ahmtilhn/sudoku_game
          run-id: 33174306923
          github-token: ${{ github.token }}
          pattern: ios-catalog-*
          path: translated-catalogs
          merge-multiple: false

      - name: Merge all remaining locales into canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          from copy import deepcopy
          from pathlib import Path

          locales = [
              'de', 'fr', 'es', 'pt', 'it', 'nl', 'pl', 'ru', 'uk', 'ar',
              'hi', 'id', 'ja', 'ko', 'zh-Hans', 'zh-Hant', 'th', 'vi', 'bn', 'ur',
          ]
          catalog_path = Path('assets/localization/Localizable.xcstrings')
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          strings = catalog.get('strings')
          if not isinstance(strings, dict):
              raise SystemExit('Canonical catalog has no strings dictionary')

          for locale in locales:
              source_path = Path('translated-catalogs') / f'ios-catalog-{locale}' / 'Localizable.xcstrings'
              if not source_path.exists():
                  raise SystemExit(f'Missing artifact for {locale}: {source_path}')
              source = json.loads(source_path.read_text(encoding='utf-8'))
              source_strings = source.get('strings')
              if not isinstance(source_strings, dict):
                  raise SystemExit(f'{locale}: artifact has no strings dictionary')
              for key, definition in strings.items():
                  if not isinstance(definition, dict):
                      continue
                  source_definition = source_strings.get(key)
                  if not isinstance(source_definition, dict):
                      raise SystemExit(f'{locale}: missing key {key}')
                  locale_value = source_definition.get('localizations', {}).get(locale)
                  if not isinstance(locale_value, dict):
                      raise SystemExit(f'{locale}: missing localization for {key}')
                  definition.setdefault('localizations', {})[locale] = deepcopy(locale_value)
              print(f'Merged {locale}')

          catalog_path.write_text(json.dumps(catalog, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Verify complete 22-language catalog
        shell: bash
        run: |
          set -euo pipefail
          cp tool/repair_ios_catalog_all_languages.py /tmp/verify_locales.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/verify_locales.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "        for key, expected in CURATED[locale].items():\n            actual = value_for(strings[key], locale)",
              "        for key, expected in CURATED[locale].items():\n            if key not in strings:\n                continue\n            actual = value_for(strings[key], locale)",
          )
          text = text.replace(
              'CATALOG = Path("assets/localization/Localizable.xcstrings")',
              'CATALOG = Path("assets/localization/Localizable.xcstrings")',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 /tmp/verify_locales.py --verify-only
          python3 tool/validate_localizations.py
          grep -q '"Startseite"' assets/localization/Localizable.xcstrings
          grep -q '"Accueil"' assets/localization/Localizable.xcstrings
          grep -q '"Instellingen"' assets/localization/Localizable.xcstrings
          grep -q '"設定"' assets/localization/Localizable.xcstrings

      - name: Commit catalog to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/localization/Localizable.xcstrings
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Catalog already finalized.'
            exit 0
          fi
          git commit -m "Fill all supported iOS translations"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
