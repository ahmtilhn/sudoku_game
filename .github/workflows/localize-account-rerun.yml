name: Finish localized account UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/localize-account-rerun.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-localized-account-main
  cancel-in-progress: false

jobs:
  update-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reuse localization transform and add mounted guards
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/localize-account-protection-main.yml').read_text()
          start_marker = "      - name: Localize all visible account-protection copy\n        shell: python\n        run: |\n"
          end_marker = "\n\n      - uses: actions/setup-java@v5"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'account-localization-transform', 'exec'), {})

          path = Path('lib/features/settings/account_protection_screen.dart')
          source = path.read_text()

          old = "        await _refreshServices();\n        _notice = _accountText("
          new = "        await _refreshServices();\n        if (!mounted) return;\n        _notice = _accountText("
          count = source.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 submit mounted-guard anchors, found {count}.')
          source = source.replace(old, new)

          old = "    if (approved != true) return;\n    await _run("
          new = "    if (approved != true) return;\n    if (!mounted) return;\n    await _run("
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected one sign-out mounted-guard anchor, found {count}.')
          source = source.replace(old, new)
          path.write_text(source)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format lib/features/settings/account_protection_screen.dart
      - run: python3 tool/validate_localizations.py
      - run: python3 tool/verify_user_facing_messages.py
      - run: python3 tool/verify_ux_contracts.py
      - run: flutter analyze --fatal-infos
      - name: Test
        shell: bash
        run: timeout --signal=TERM 10m flutter test --reporter expanded --concurrency=1

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add lib/features/settings/account_protection_screen.dart
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Localize account protection and deletion UX'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
