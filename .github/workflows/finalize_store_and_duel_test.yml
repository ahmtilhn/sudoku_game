name: Finalize store and duel responsive coverage

on:
  push:
    branches:
      - agent/portrait-responsive-overhaul
    paths:
      - .github/workflows/finalize_store_and_duel_test.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/portrait-responsive-overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch remaining portrait cases
        run: |
          python - <<'PY'
          from pathlib import Path

          store = Path('lib/features/economy/coin_store_screen.dart')
          text = store.read_text(encoding='utf-8')
          text = text.replace(
              """            SizedBox(
              width: 360,
              child: Row(""",
              """            ConstrainedBox(
              constraints: const BoxConstraints(maxWidth: 360),
              child: Row(""",
              1,
          )
          text = text.replace(
              """                    product.title,
                    maxLines: 1,""",
              """                    product.title,
                    maxLines: 2,""",
              1,
          )
          store.write_text(text, encoding='utf-8')

          test = Path('test/online_duel_screen_test.dart')
          text = test.read_text(encoding='utf-8')
          marker = """      _ViewportVariant(
        label: 'text scale 1.3 390x844',
        size: Size(390, 844),
        brightness: Brightness.dark,
        textScale: 1.3,
      ),"""
          addition = marker + """
      _ViewportVariant(
        label: 'text scale 2.0 390x844',
        size: Size(390, 844),
        brightness: Brightness.dark,
        textScale: 2,
      ),"""
          if 'text scale 2.0 390x844' not in text:
              if marker not in text:
                  raise SystemExit('online duel text-scale marker not found')
              text = text.replace(marker, addition, 1)
          test.write_text(text, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize_store_and_duel_test.yml
      - name: Commit final code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete store and duel responsive coverage"
          git push origin HEAD:agent/portrait-responsive-overhaul
