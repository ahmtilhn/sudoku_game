name: Samurai Mode Check

on:
  push:
    branches: [feature/samurai-sudoku]
    paths:
      - 'lib/domain/samurai_sudoku.dart'
      - 'lib/widgets/samurai_board.dart'
      - 'lib/features/game/samurai_game_screen.dart'
      - 'lib/features/career/career_hub_screen.dart'
      - 'lib/localization/app_strings.dart'
      - 'assets/localization/Localizable.xcstrings'
      - 'android/app/src/main/res/values/strings.xml'
      - 'test/samurai_sudoku_test.dart'
      - '.github/workflows/samurai-check.yml'

permissions:
  contents: read

concurrency:
  group: samurai-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze project
        run: flutter analyze --fatal-infos
      - name: Test Samurai engine
        run: flutter test test/samurai_sudoku_test.dart --reporter expanded
