name: Apply challenge room recovery

on:
  push:
    branches:
      - fix/android-notification-icon
    paths:
      - .github/workflows/apply_challenge_room_recovery.yml
      - tool/patch_challenge_room_recovery.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-notification-icon
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/social_worker/package-lock.json

      - name: Apply targeted patch
        run: python3 tool/patch_challenge_room_recovery.py

      - name: Verify Worker type safety
        working-directory: backend/social_worker
        run: |
          npm ci
          npm run typecheck

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit repaired challenge flow
        run: |
          rm -f tool/patch_challenge_room_recovery.py
          rm -f .github/workflows/apply_challenge_room_recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/social_worker/src/index.ts \
                  lib/features/social/ux_challenge_invitation_screen.dart \
                  lib/features/duel/pre_match_ready_screen.dart \
                  tool/patch_challenge_room_recovery.py \
                  .github/workflows/apply_challenge_room_recovery.yml
          git commit -m "Repair accepted challenge room creation"
          git push origin HEAD:fix/android-notification-icon
